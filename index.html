<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keely & Brian's Family Recipes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Georgia', serif; background: #f9f5eb; }
    .hero { background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('PXL_20251206_224748469.jpg') center/cover; min-height: 100vh; }
  </style>
</head>
<body>

<nav class="bg-amber-900 text-white py-4">
  <div class="max-w-6xl mx-auto px-6 flex justify-between">
    <h1 class="text-3xl font-bold italic">Keely & Brian's</h1>
    <div class="space-x-6">
      <button onclick="showHome()" class="hover:underline">Home</button>
      <button onclick="showAllRecipes()" class="hover:underline">Recipes</button>
      <button onclick="showAddForm()" class="hover:underline font-bold">+ Add Recipe</button>
    </div>
  </div>
</nav>

<!-- HOME -->
<div id="home" class="hero flex items-center justify-center text-center text-white">
  <div>
    <h1 class="text-6xl font-serif italic">Keely & Brian's Family Recipes</h1>
    <button onclick="showAllRecipes()" class="mt-8 bg-amber-700 px-10 py-4 rounded-full text-xl">Browse Recipes</button>
  </div>
</div>

<!-- Add Form -->
<div id="addForm" class="max-w-xl mx-auto p-8 hidden">
  <h2 class="text-3xl mb-6">Add New Recipe</h2>
  <input id="title" placeholder="Recipe Title" class="w-full p-4 border mb-4 rounded-xl">
  <button onclick="addRecipe()" class="w-full bg-green-700 text-white py-6 rounded-2xl text-xl font-bold">
    ADD RECIPE
  </button>
</div>

<!-- Recipes List -->
<div id="allRecipes" class="max-w-6xl mx-auto p-8 hidden">
  <h2 class="text-3xl mb-6">All Recipes</h2>
  <div id="recipeList"></div>
</div>

<script>
let recipes = JSON.parse(localStorage.getItem('recipes')) || [];

function showHome() {
  document.getElementById('home').style.display = 'flex';
  document.getElementById('addForm').classList.add('hidden');
  document.getElementById('allRecipes').classList.add('hidden');
}

function showAddForm() {
  document.getElementById('home').style.display = 'none';
  document.getElementById('addForm').classList.remove('hidden');
  document.getElementById('allRecipes').classList.add('hidden');
}

function showAllRecipes() {
  document.getElementById('home').style.display = 'none';
  document.getElementById('addForm').classList.add('hidden');
  document.getElementById('allRecipes').classList.remove('hidden');
  renderRecipes();
}

function addRecipe() {
  const title = document.getElementById('title').value.trim();
  if (!title) {
    alert("Please enter a title");
    return;
  }

  recipes.unshift({ id: Date.now(), title: title });
  localStorage.setItem('recipes', JSON.stringify(recipes));
  
  alert(`Added: ${title}`);
  document.getElementById('title').value = '';
  showAllRecipes();
}

function renderRecipes() {
  const list = document.getElementById('recipeList');
  list.innerHTML = recipes.map(r => `
    <div class="bg-white p-6 mb-4 rounded-2xl shadow">
      <h3 class="text-2xl">${r.title}</h3>
    </div>
  `).join('');
}

// Start on home
showHome();
</script>
</body>
</html>
