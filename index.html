<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keely & Brian's Family Recipes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@v5/dist/tesseract.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@400;500;600&display=swap');
    body { font-family: 'Poppins', sans-serif; background: #fffaf0; }
    .serif { font-family: 'Playfair Display', serif; }

    .hero { 
      background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), url('IMG_9206.JPEG') center/cover no-repeat fixed;
      min-height: 100vh;
    }

    .recipe-card, .recipe-list-item { transition: all 0.3s ease; }
    .recipe-card:hover, .recipe-list-item:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }

    .nav-button { 
      font-size: 1.35rem; 
      font-weight: 700; 
      padding: 8px 12px; 
      transition: all 0.2s; 
    }
    @media (max-width: 640px) { 
      .nav-button { font-size: 1.05rem; padding: 6px 8px; } 
    }

    .form-input { 
      width: 100%; 
      padding: 1.25rem; 
      border: 2px solid #f9a8d4; 
      border-radius: 1.5rem; 
      font-size: 1.1rem; 
      transition: all 0.2s;
    }
    .form-input:focus {
      border-color: #db2777;
      outline: none;
      box-shadow: 0 0 0 4px rgba(236, 72, 153, 0.15);
    }

    .drop-zone-active {
      background-color: #fce7f3;
      border-color: #db2777;
    }

    .category-btn {
      transition: all 0.2s ease;
    }
    .category-btn.active {
      background-color: #db2777;
      color: white;
      transform: scale(1.05);
    }
  </style>
</head>
<body class="min-h-screen pb-20">

<nav class="bg-[#FFF3E0] text-amber-900 py-5 sticky top-0 z-50 shadow-xl">
  <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
    <h1 class="text-3xl font-bold serif">Keely & Brian's</h1>
    <div class="flex flex-wrap gap-3 text-lg font-medium">
      <button onclick="showHome()" class="nav-button hover:text-pink-700">Home</button>
      <button onclick="showRecipesPage()" class="nav-button hover:text-pink-700">Recipes</button>
      <button onclick="showFavoritesPage()" class="nav-button hover:text-pink-700">Favs ❤️</button>
      <button onclick="showAddForm()" class="nav-button hover:text-pink-700 font-semibold">+ Add Recipe</button>
    </div>
  </div>
</nav>

<!-- HOME -->
<div id="home" class="hero flex items-center justify-center text-center text-white">
  <div class="max-w-4xl px-6">
    <h1 class="text-6xl md:text-8xl serif italic tracking-wider mb-6">Keely & Brian's<br>Family Recipes</h1>
    <p class="text-3xl mb-12">Love. Tradition. Flavor.</p>
    <button onclick="showMenuPlanPage()" class="mt-12 bg-white text-pink-900 px-8 py-4 rounded-3xl text-xl font-semibold shadow-xl hover:bg-pink-50 transition">
      📅 Menu Planning
    </button>
  </div>
</div>

<!-- RECIPES PAGE -->
<div id="recipesPage" class="max-w-6xl mx-auto px-6 py-12 hidden">
  <div class="flex flex-col md:flex-row md:items-center gap-6 mb-8">
    <input id="searchInput" type="text" placeholder="🔍 Search recipes..." 
           class="flex-1 text-2xl py-6 px-8 rounded-3xl border-4 border-pink-900" 
           onkeyup="filterRecipes()">
  </div>

  <div id="categoryFilters" class="flex flex-wrap gap-3 mb-10"></div>

  <div id="recipeListView" class="space-y-4"></div>
</div>

<!-- ADD RECIPE -->
<div id="addForm" class="max-w-3xl mx-auto px-6 py-12 hidden">
  <h2 class="text-5xl serif mb-10 text-center">Add a New Family Treasure 🍲</h2>
  <div class="bg-white p-10 rounded-3xl shadow-2xl">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
      <input id="newTitle" placeholder="Recipe Title *" class="form-input text-center font-semibold">
      
      <select id="newCategory" class="form-input">
        <option value="">Select Category</option>
        <option value="Main Dishes">Main Dishes</option>
        <option value="Side Dishes">Side Dishes</option>
        <option value="Appetizers">Appetizers</option>
        <option value="Soups">Soups</option>
        <option value="Bread">Bread</option>
        <option value="Desserts">Desserts</option>
        <option value="Salads">Salads</option>
        <option value="Pasta">Pasta</option>
        <option value="Beverages">Beverages</option>
        <option value="Breakfast">Breakfast</option>
        <option value="Sauces & Spices">Sauces & Spices</option>
        <option value="Specialty Items">Specialty Items</option>
      </select>
    </div>

    <input id="newTags" placeholder="Tags (comma separated, e.g. quick, gluten-free, holiday)" class="form-input mb-8">

    <!-- Image Section -->
    <div class="mb-10 p-8 border-2 border-dashed border-pink-700 rounded-3xl bg-pink-50">
      <label class="block text-xl mb-4 font-medium">📸 Recipe Card Images (multiple pages OK)</label>
      <div class="grid grid-cols-2 gap-6">
        <button onclick="openCamera()" class="bg-gradient-to-br from-pink-600 to-rose-600 text-white py-8 rounded-3xl flex flex-col items-center gap-3 hover:brightness-110 transition">
          <i class="fas fa-camera text-4xl"></i>
          <span class="font-semibold">Camera</span>
        </button>
        <div id="dropZone" class="p-8 text-center rounded-3xl cursor-pointer flex flex-col justify-center border-2 border-dashed border-pink-700 hover:bg-pink-100 transition">
          <i class="fas fa-cloud-upload-alt text-4xl text-pink-700"></i>
          <span class="mt-3 font-medium">Upload Image(s)</span>
          <input type="file" id="imageUpload" accept="image/*" class="hidden" multiple>
        </div>
      </div>

      <button onclick="startOCR()" id="ocrBtn" class="mt-6 w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white py-4 text-base rounded-3xl font-semibold flex items-center justify-center gap-2 disabled:opacity-50">
        <i class="fas fa-magic"></i> 
        <span id="ocrBtnText">Autofill from Images (OCR)</span>
      </button>

      <div id="previewImages" class="flex flex-wrap gap-4 mt-8"></div>
    </div>

    <!-- Ingredients -->
    <div class="mb-8">
      <label class="block text-xl mb-3 font-medium">Ingredients (one per line)</label>
      <textarea id="newIngredients" placeholder="• 2 cups flour&#10;• 1 tsp salt&#10;..." class="form-input h-52 resize-y"></textarea>
    </div>

    <!-- Instructions -->
    <div class="mb-10">
      <label class="block text-xl mb-3 font-medium">Instructions (one step per line)</label>
      <textarea id="newInstructions" placeholder="1. Preheat oven to 350°F&#10;2. Mix dry ingredients..." class="form-input h-52 resize-y"></textarea>
    </div>

    <!-- Notes -->
    <div class="mb-10">
      <label class="block text-xl mb-3 font-medium">Additional Notes / History</label>
      <textarea id="newNotes" placeholder="Grandma made this every Christmas..." class="form-input h-32 resize-y"></textarea>
    </div>

    <button onclick="addNewRecipe()" id="addRecipeBtn" class="w-full bg-gradient-to-r from-pink-900 to-rose-900 text-white py-7 text-2xl rounded-3xl font-bold transition-all hover:brightness-110 disabled:opacity-70">
      🍳 ADD TO FAMILY COOKBOOK
    </button>
  </div>
</div>

<!-- SINGLE RECIPE -->
<div id="singleRecipePage" class="max-w-4xl mx-auto px-6 py-12 hidden">
  <button onclick="closeSingleRecipe()" class="mb-8 text-2xl hover:text-pink-700 flex items-center gap-2">
    ← Back to Recipes
  </button>
  <div class="bg-white rounded-3xl shadow-2xl p-8">
    <div class="flex justify-between items-start mb-6">
      <h2 id="singleRecipeTitle" class="text-5xl serif"></h2>
      <div class="flex gap-4">
        <button onclick="editCurrentRecipe()" class="text-pink-600 hover:text-pink-700"><i class="fas fa-edit"></i> Edit</button>
        <button onclick="printRecipe()" class="text-pink-600 hover:text-pink-700"><i class="fas fa-print"></i> Print</button>
      </div>
    </div>
    <div class="flex gap-6 text-sm text-gray-600 mb-6">
      <span id="singleCategory"></span>
    </div>
    <img id="singleRecipeMainImage" class="w-full h-96 object-cover rounded-2xl mb-8 cursor-pointer" onclick="openImageViewer()">
    
    <div class="grid md:grid-cols-2 gap-10">
      <div>
        <h3 class="text-2xl font-semibold mb-4">Ingredients</h3>
        <ul id="singleIngredients" class="space-y-3 text-lg"></ul>
      </div>
      <div>
        <h3 class="text-2xl font-semibold mb-4">Instructions</h3>
        <ol id="singleInstructions" class="space-y-4 text-lg"></ol>
      </div>
    </div>
  </div>
</div>

<!-- Image Viewer -->
<div id="imageViewer" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center z-[100] p-4">
  <div class="relative max-w-5xl w-full">
    <img id="viewerImage" src="" class="max-h-[85vh] w-full object-contain rounded-2xl">
    <button onclick="closeImageViewer()" class="absolute top-6 right-6 text-white text-5xl hover:text-pink-400">✕</button>
  </div>
</div>

<script>
// ==================== DATA ====================
let recipes = JSON.parse(localStorage.getItem('keelyBrianRecipes')) || [];
let newRecipeImages = [];
let currentRecipe = null;
let isAdding = false;
let ocrWorker = null;
let currentCategoryFilter = "All";

const allCategories = [
  "All", "Main Dishes", "Side Dishes", "Appetizers", "Soups", "Bread",
  "Desserts", "Salads", "Pasta", "Beverages", "Breakfast", "Sauces & Spices", "Specialty Items"
];

// ==================== UTILS ====================
function getDefaultImage() { return "https://picsum.photos/id/1080/800/600"; }
function saveRecipes() { localStorage.setItem('keelyBrianRecipes', JSON.stringify(recipes)); }

// ==================== IMAGE COMPRESSION ====================
function compressImage(file, maxWidth = 1200, quality = 0.85) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ==================== NAVIGATION ====================
function hideAll() {
  document.getElementById('home').classList.add('hidden');
  document.getElementById('recipesPage').classList.add('hidden');
  document.getElementById('addForm').classList.add('hidden');
  document.getElementById('singleRecipePage').classList.add('hidden');
  document.getElementById('imageViewer').classList.add('hidden');
}

function showHome() { hideAll(); document.getElementById('home').classList.remove('hidden'); }
function showRecipesPage() { 
  hideAll(); 
  document.getElementById('recipesPage').classList.remove('hidden'); 
  renderCategoryFilters();
  renderRecipeList(); 
}
function showFavoritesPage() { alert("Favorites page coming soon! ❤️"); }
function showMenuPlanPage() { alert("Menu planning coming soon! 📅"); }
function showAddForm() { 
  hideAll(); 
  resetAddForm(); 
  document.getElementById('addForm').classList.remove('hidden'); 
}

// ==================== CATEGORY FILTERS ====================
function renderCategoryFilters() {
  const container = document.getElementById('categoryFilters');
  container.innerHTML = allCategories.map(cat => `
    <button onclick="filterByCategory('${cat}')" 
            class="category-btn px-6 py-3 rounded-3xl font-medium text-lg border-2 
                   ${currentCategoryFilter === cat ? 'active border-pink-600 bg-pink-600 text-white' : 'border-pink-200 hover:border-pink-400'}">
      ${cat}
    </button>
  `).join('');
}

function filterByCategory(category) {
  currentCategoryFilter = category;
  renderCategoryFilters();
  filterRecipes();
}

// ==================== IMAGE HANDLING ====================
function openCamera() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment';
  input.onchange = async e => {
    const files = e.target.files;
    if (!files) return;
    for (let file of files) {
      if (!file.type.startsWith('image/')) continue;
      const compressed = await compressImage(file);
      newRecipeImages.push(compressed);
    }
    renderPreviewImages();
  };
  input.click();
}

function handleFiles(files) {
  if (!files) return;
  Array.from(files).forEach(async file => {
    if (!file.type.startsWith('image/')) return;
    const compressed = await compressImage(file);
    newRecipeImages.push(compressed);
    renderPreviewImages();
  });
}

function renderPreviewImages() {
  const container = document.getElementById('previewImages');
  container.innerHTML = newRecipeImages.map((src, i) => `
    <div class="relative group">
      <img src="${src}" class="w-32 h-32 object-cover rounded-2xl shadow">
      <button onclick="removeImage(${i});" 
              class="absolute -top-2 -right-2 bg-red-500 hover:bg-red-600 text-white w-7 h-7 rounded-full text-xs flex items-center justify-center shadow">
        ×
      </button>
    </div>
  `).join('');
}

function removeImage(index) {
  newRecipeImages.splice(index, 1);
  renderPreviewImages();
}

function setupDropZone() {
  const dropZone = document.getElementById('dropZone');
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drop-zone-active'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drop-zone-active'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drop-zone-active');
    handleFiles(e.dataTransfer.files);
  });
}

// ==================== ADD / EDIT RECIPE ====================
function resetAddForm() {
  newRecipeImages = [];
  document.getElementById('previewImages').innerHTML = '';
  document.getElementById('newTitle').value = '';
  document.getElementById('newCategory').value = '';
  document.getElementById('newTags').value = '';
  document.getElementById('newIngredients').value = '';
  document.getElementById('newInstructions').value = '';
  document.getElementById('newNotes').value = '';
}

async function addNewRecipe() {
  if (isAdding) return;
  isAdding = true;
  const btn = document.getElementById('addRecipeBtn');
  btn.disabled = true;
  btn.innerHTML = 'Adding... 🍳';

  try {
    const title = document.getElementById('newTitle').value.trim();
    if (!title) { alert("Please enter a recipe title!"); return; }

    const newRecipe = {
      id: Date.now(),
      title: title,
      category: document.getElementById('newCategory').value || "Uncategorized",
      tags: document.getElementById('newTags').value.split(',').map(t => t.trim()).filter(Boolean),
      ingredients: document.getElementById('newIngredients').value.split('\n').map(i => i.trim()).filter(Boolean),
      instructions: document.getElementById('newInstructions').value.split('\n').map(i => i.trim()).filter(Boolean),
      images: newRecipeImages.length > 0 ? [...newRecipeImages] : [getDefaultImage()],
      notes: document.getElementById('newNotes').value.trim(),
      favorite: false,
      dateAdded: new Date().toISOString()
    };

    recipes.unshift(newRecipe);
    saveRecipes();

    alert(`✅ "${title}" added successfully!`);
    resetAddForm();
    showRecipesPage();

  } catch (err) {
    console.error(err);
    alert("Failed to add recipe. Check console.");
  } finally {
    isAdding = false;
    btn.disabled = false;
    btn.innerHTML = '🍳 ADD TO FAMILY COOKBOOK';
  }
}

// Basic edit stub (expand as needed)
function editCurrentRecipe() {
  if (!currentRecipe) return;
  alert("Edit mode: Populate the add form with current data and change the button to 'Save Changes' (full implementation left as exercise or let me know for more help).");
}

// Print
function printRecipe() {
  if (!currentRecipe) return;
  const printWindow = window.open('', '_blank');
  printWindow.document.write(`
    <html><head><title>${currentRecipe.title}</title>
    <style>body{font-family:sans-serif;max-width:800px;margin:40px auto;line-height:1.6;} h1{margin-bottom:10px;}</style>
    </head><body>
      <h1>${currentRecipe.title}</h1>
      <p><strong>Category:</strong> ${currentRecipe.category}</p>
      <h2>Ingredients</h2><ul>${(currentRecipe.ingredients || []).map(i => `<li>${i}</li>`).join('')}</ul>
      <h2>Instructions</h2><ol>${(currentRecipe.instructions || []).map((s,i) => `<li>${s}</li>`).join('')}</ol>
      ${currentRecipe.notes ? `<h2>Notes</h2><p>${currentRecipe.notes}</p>` : ''}
    </body></html>
  `);
  printWindow.document.close();
  printWindow.focus();
  printWindow.print();
}

// ==================== VIEW / RENDER ====================
function openRecipe(id) {
  currentRecipe = recipes.find(r => r.id === id);
  if (!currentRecipe) return alert("Recipe not found");

  document.getElementById('singleRecipeTitle').textContent = currentRecipe.title;
  document.getElementById('singleCategory').textContent = currentRecipe.category || 'Uncategorized';
  
  const mainImg = document.getElementById('singleRecipeMainImage');
  mainImg.src = currentRecipe.images && currentRecipe.images[0] ? currentRecipe.images[0] : getDefaultImage();

  document.getElementById('singleIngredients').innerHTML = (currentRecipe.ingredients || []).map(ing => `<li class="flex gap-3"><span class="text-pink-600">•</span> ${ing}</li>`).join('');
  document.getElementById('singleInstructions').innerHTML = (currentRecipe.instructions || []).map((step, i) => `<li class="flex gap-4"><span class="font-bold text-pink-600 shrink-0">${i+1}.</span><span>${step}</span></li>`).join('');

  hideAll();
  document.getElementById('singleRecipePage').classList.remove('hidden');
}

function renderRecipeList(filteredRecipes = recipes) {
  const container = document.getElementById('recipeListView');
  if (filteredRecipes.length === 0) {
    container.innerHTML = '<p class="text-gray-500 py-20 text-center text-xl">No recipes found.</p>';
    return;
  }
  container.innerHTML = filteredRecipes.map(r => `
    <div onclick="openRecipe(${r.id})" class="recipe-list-item bg-white p-8 rounded-3xl shadow cursor-pointer flex gap-6">
      <img src="${r.images && r.images[0] ? r.images[0] : getDefaultImage()}" class="w-28 h-28 object-cover rounded-2xl">
      <div class="flex-1 min-w-0">
        <h3 class="text-2xl font-semibold mb-1">${r.title}</h3>
        <p class="text-pink-700">${r.category || 'Uncategorized'}</p>
        ${r.tags && r.tags.length ? `<p class="text-sm text-gray-500 mt-2">${r.tags.join(' • ')}</p>` : ''}
      </div>
    </div>
  `).join('');
}

function filterRecipes() {
  const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
  let filtered = recipes;
  if (currentCategoryFilter !== "All") {
    filtered = filtered.filter(r => r.category === currentCategoryFilter);
  }
  if (searchTerm) {
    filtered = filtered.filter(r => 
      r.title.toLowerCase().includes(searchTerm) ||
      (r.category && r.category.toLowerCase().includes(searchTerm)) ||
      (r.tags && r.tags.some(t => t.toLowerCase().includes(searchTerm))) ||
      (r.ingredients && r.ingredients.some(i => i.toLowerCase().includes(searchTerm)))
    );
  }
  renderRecipeList(filtered);
}

function closeSingleRecipe() { 
  hideAll(); 
  showRecipesPage(); 
}

function openImageViewer() {
  const viewer = document.getElementById('imageViewer');
  const img = document.getElementById('viewerImage');
  if (currentRecipe && currentRecipe.images && currentRecipe.images.length > 0) {
    img.src = currentRecipe.images[0];
  }
  viewer.classList.remove('hidden');
}

function closeImageViewer() {
  document.getElementById('imageViewer').classList.add('hidden');
}

// ==================== OCR (unchanged) ====================
async function startOCR() {
  if (newRecipeImages.length === 0) { alert("Please add at least one image first!"); return; }
  const btn = document.getElementById('ocrBtn');
  const btnText = document.getElementById('ocrBtnText');
  btn.disabled = true;
  btnText.innerHTML = 'Processing... ⏳';

  try {
    if (!ocrWorker) ocrWorker = await Tesseract.createWorker('eng', 1, { logger: m => console.log(m) });
    let combinedText = "";
    for (let imageData of newRecipeImages) {
      const { data: { text } } = await ocrWorker.recognize(imageData);
      combinedText += text + "\n\n";
    }
    const lines = combinedText.split('\n').map(l => l.trim()).filter(Boolean);
    const mid = Math.floor(lines.length / 2);
    if (lines.length > 0) {
      document.getElementById('newIngredients').value = lines.slice(0, mid).join('\n');
      document.getElementById('newInstructions').value = lines.slice(mid).join('\n');
    }
    alert("OCR complete! Review and edit the text.");
  } catch (err) {
    console.error(err);
    alert("OCR failed. Try clearer images.");
  } finally {
    btn.disabled = false;
    btnText.innerHTML = `<i class="fas fa-magic"></i> Autofill from Images (OCR)`;
  }
}

// ==================== INIT ====================
window.onload = function() {
  setupDropZone();
  document.getElementById('imageUpload').addEventListener('change', e => handleFiles(e.target.files));
  showHome();
  console.log("✅ Family Recipe App fully loaded with camera fixes");
};
</script>
</body>
</html>
