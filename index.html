<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keely & Brian's Family Recipes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@v5/dist/tesseract.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@400;500;600&display=swap');
    body { font-family: 'Poppins', sans-serif; background: #fffaf0; }
    .serif { font-family: 'Playfair Display', serif; }

    .hero { 
      background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), url('IMG_9206.JPEG') center/cover no-repeat fixed;
      min-height: 100vh;
    }

    .recipe-card, .recipe-list-item { transition: all 0.3s ease; }
    .recipe-card:hover, .recipe-list-item:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }

    .heart { cursor: pointer; font-size: 2.4rem; transition: all 0.3s; }
    .heart:hover { transform: scale(1.4) rotate(12deg); }

    .nav-button {
      font-size: 1.35rem; font-weight: 700; padding: 8px 12px; transition: all 0.2s;
    }
    @media (max-width: 640px) {
      .nav-button { font-size: 1.05rem; padding: 6px 8px; }
    }
    .nav-button:hover { color: #9f1239; transform: translateY(-1px); }

    .form-input {
      width: 100%; padding: 1.25rem; border: 2px solid #f9a8d4; border-radius: 1.5rem; font-size: 1.1rem;
    }

    .cat-btn {
      transition: all 0.2s;
      font-weight: 600;
    }
    .cat-btn.active {
      background-color: #9f1239 !important;
      color: white !important;
    }
  </style>
</head>
<body class="min-h-screen pb-20">

<nav class="bg-[#FFF3E0] text-amber-900 py-5 sticky top-0 z-50 shadow-xl">
  <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
    <h1 class="text-3xl font-bold serif">Keely & Brian's</h1>
    <div class="flex flex-wrap gap-3 text-lg font-medium">
      <button onclick="showHome()" class="nav-button hover:text-pink-700">Home</button>
      <button onclick="showRecipesPage()" class="nav-button hover:text-pink-700">Recipes</button>
      <button onclick="showFavoritesPage()" class="nav-button hover:text-pink-700">Favs ❤️</button>
      <button onclick="showAddForm()" class="nav-button hover:text-pink-700 font-semibold">+ Add Recipe</button>
    </div>
  </div>
</nav>

<!-- HOME -->
<div id="home" class="hero flex items-center justify-center text-center text-white">
  <div class="max-w-4xl px-6">
    <h1 class="text-6xl md:text-8xl serif italic tracking-wider mb-6">Keely & Brian's<br>Family Recipes</h1>
    <p class="text-3xl mb-12">Love. Tradition. Flavor.</p>
    <button onclick="showMenuPlanPage()" class="mt-12 bg-white text-pink-900 px-8 py-4 rounded-3xl text-xl font-semibold shadow-xl hover:bg-pink-50 transition">
      📅 Menu Planning
    </button>
  </div>
</div>

<!-- FAVORITES -->
<div id="favoritesPage" class="max-w-6xl mx-auto px-6 py-12 hidden">
  <h2 class="text-5xl serif mb-8">❤️ Most Loved Family Favorites</h2>
  <div id="favoritesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
</div>

<!-- RECIPES -->
<div id="recipesPage" class="max-w-6xl mx-auto px-6 py-12 hidden">
  <input id="searchInput" type="text" placeholder="🔍 Search recipes or tags..." class="w-full text-2xl py-6 px-8 rounded-3xl border-4 border-pink-900 mb-6" onkeyup="filterRecipes()">
  
  <div id="categories" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8"></div>

  <div class="flex justify-between items-center mb-8">
    <h2 class="text-5xl serif">Our Recipe Collection</h2>
    <div class="flex gap-2 bg-white rounded-3xl p-1 shadow-inner">
      <button onclick="setViewMode('list')" id="btnList" class="px-6 py-2 rounded-3xl font-medium">List</button>
      <button onclick="setViewMode('grid')" id="btnGrid" class="px-6 py-2 rounded-3xl font-medium">Grid</button>
    </div>
  </div>
  <div id="recipeListView" class="mt-8 space-y-4"></div>
  <div id="recipeGridView" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mt-8 hidden"></div>
</div>

<!-- ADD RECIPE -->
<div id="addForm" class="max-w-2xl mx-auto px-6 py-12 hidden">
  <h2 class="text-5xl serif mb-10 text-center">Add a New Family Treasure 🍲</h2>
  <div class="bg-white p-10 rounded-3xl shadow-2xl">
    <input id="newTitle" placeholder="Recipe Title *" class="form-input mb-8 text-center">
    <select id="newCategory" class="form-input mb-8">
      <option value="">Select Category</option>
      <option value="Main Dishes">Main Dishes</option>
      <option value="Side Dishes">Side Dishes</option>
      <option value="Appetizers">Appetizers</option>
      <option value="Soups">Soups</option>
      <option value="Bread">Bread</option>
      <option value="Desserts">Desserts</option>
      <option value="Salads">Salads</option>
      <option value="Pasta">Pasta</option>
      <option value="Beverages">Beverages</option>
      <option value="Breakfast">Breakfast</option>
      <option value="Sauces & Spices">Sauces & Spices</option>
      <option value="Specialty Items">Specialty Items</option>
    </select>
    <input id="newTags" placeholder="Tags (comma separated)" class="form-input mb-8">

    <div class="mb-10 p-8 border-2 border-dashed border-pink-700 rounded-3xl bg-pink-50">
      <label class="block text-xl mb-4 font-medium">📸 Scan Recipe Card</label>
      <div class="grid grid-cols-2 gap-6">
        <button onclick="openCamera()" class="bg-gradient-to-br from-pink-600 to-rose-600 text-white py-8 rounded-3xl flex flex-col items-center gap-3 hover:brightness-110 transition">
          <i class="fas fa-camera text-4xl"></i>
          <span class="font-semibold">Camera</span>
        </button>
        <div id="dropZone" class="drop-zone p-8 text-center rounded-3xl cursor-pointer flex flex-col justify-center border-2 border-dashed border-pink-700 hover:bg-pink-100 transition">
          <i class="fas fa-cloud-upload-alt text-4xl text-pink-700"></i>
          <span class="mt-3 font-medium">Upload Image</span>
          <input type="file" id="imageUpload" accept="image/*" class="hidden" multiple>
        </div>
      </div>

      <button onclick="startOCR()" id="ocrBtn" class="mt-6 w-full bg-blue-600 hover:bg-blue-700 text-white py-4 text-base rounded-3xl font-semibold flex items-center justify-center gap-2">
        <i class="fas fa-magic"></i> Autofill Recipe
      </button>

      <div id="previewImages" class="flex flex-wrap gap-4 mt-8"></div>
    </div>

    <textarea id="newIngredients" placeholder="Ingredients (one per line)" class="form-input h-48 mb-8"></textarea>
    <textarea id="newInstructions" placeholder="Instructions (one step per line)" class="form-input h-48 mb-10"></textarea>

    <div class="flex items-center justify-center gap-4 mb-8">
      <button onclick="toggleFavoriteInAdd()" id="addHeart" class="heart text-red-500 text-5xl">♡</button>
      <span class="text-xl font-medium text-pink-900">Favorite</span>
    </div>

    <button onclick="addNewRecipe()" id="addRecipeBtn" class="w-full bg-gradient-to-r from-pink-900 to-rose-900 text-white py-7 text-2xl rounded-3xl font-bold transition-all">
      🍳 ADD TO FAMILY COOKBOOK
    </button>
  </div>
</div>

<!-- SINGLE RECIPE -->
<div id="singleRecipePage" class="max-w-4xl mx-auto px-6 py-12 hidden">
  <button onclick="closeSingleRecipe()" class="mb-8 text-2xl hover:text-pink-700">← Back to Recipes</button>
  <div class="bg-white rounded-3xl shadow-2xl overflow-hidden">
    <img id="singleRecipeMainImage" class="w-full h-96 object-cover cursor-pointer" onclick="openImageViewer()">
    <div class="p-10">
      <h2 id="singleRecipeTitle" class="text-5xl serif"></h2>
      <div id="singleRecipeTags" class="text-pink-700 my-4"></div>

      <div class="grid md:grid-cols-2 gap-8">
        <div>
          <h3 class="text-3xl serif mb-3">🥕 Ingredients</h3>
          <textarea id="editIngredients" class="w-full h-64 p-6 border-2 border-pink-200 rounded-3xl"></textarea>
        </div>
        <div>
          <h3 class="text-3xl serif mb-3">👩‍🍳 Instructions</h3>
          <textarea id="editInstructions" class="w-full h-64 p-6 border-2 border-pink-200 rounded-3xl"></textarea>
        </div>
      </div>

      <button onclick="saveRecipeEdits()" class="mt-6 bg-green-600 text-white px-8 py-4 rounded-2xl">💾 Save Changes</button>

      <div class="mt-12">
        <h3 class="text-3xl serif mb-3">Family Notes</h3>
        <textarea id="singleNotesArea" class="w-full h-40 p-6 border-2 border-pink-200 rounded-3xl"></textarea>
        <button onclick="saveNotes()" class="mt-4 bg-pink-700 text-white px-8 py-3 rounded-2xl">Save Notes</button>
      </div>

      <div class="grid grid-cols-1 gap-4 mt-12">
        <button onclick="printOriginalRecipe()" class="w-full bg-gradient-to-r from-pink-900 to-rose-900 text-white py-6 rounded-3xl text-xl font-bold">🖨️ Print Full Recipe</button>
        <button onclick="deleteCurrentRecipeFromSingle()" class="w-full bg-red-700 text-white py-5 rounded-3xl">🗑️ Delete Recipe</button>
      </div>
    </div>
  </div>
</div>

<!-- Image Viewer -->
<div id="imageViewer" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center z-[100] p-4">
  <div class="relative max-w-5xl w-full">
    <img id="viewerImage" src="" class="max-h-[85vh] w-full object-contain rounded-2xl">
    <button onclick="closeImageViewer()" class="absolute top-6 right-6 text-white text-5xl">✕</button>
  </div>
</div>

<!-- MENU PLAN -->
<div id="menuPlanPage" class="max-w-6xl mx-auto px-6 py-12 hidden">
  <h2 class="text-5xl serif mb-8">📅 Family Menu Planner</h2>
  <button onclick="createNewMenu()" class="bg-green-600 hover:bg-green-700 text-white px-8 py-4 rounded-3xl text-xl mb-8">+ Create New Menu</button>
  <div id="savedMenusList" class="space-y-6"></div>
</div>

<script>
// ==================== DATA ====================
let recipes = JSON.parse(localStorage.getItem('keelyBrianRecipes')) || [];
let menus = JSON.parse(localStorage.getItem('keelyBrianMenus')) || [];
let newRecipeImages = [];
let currentRecipe = null;
let isAdding = false;
let currentViewMode = 'list';

const categoryImages = {
  "Breakfast": "https://picsum.photos/id/1080/800/600",
  "Main Dishes": "https://picsum.photos/id/1060/800/600",
  "Desserts": "https://picsum.photos/id/1083/800/600"
};

function getDefaultImage(cat) {
  return categoryImages[cat] || "https://picsum.photos/id/1080/800/600";
}

function saveRecipes() { localStorage.setItem('keelyBrianRecipes', JSON.stringify(recipes)); }
function saveMenus() { localStorage.setItem('keelyBrianMenus', JSON.stringify(menus)); }

// ==================== NAVIGATION ====================
function hideAll() {
  document.getElementById('home').style.display = 'none';
  document.getElementById('recipesPage').classList.add('hidden');
  document.getElementById('favoritesPage').classList.add('hidden');
  document.getElementById('addForm').classList.add('hidden');
  document.getElementById('singleRecipePage').classList.add('hidden');
  document.getElementById('menuPlanPage').classList.add('hidden');
  closeImageViewer();
}

function showHome() { hideAll(); document.getElementById('home').style.display = 'flex'; }
function showRecipesPage() { 
  hideAll(); 
  document.getElementById('recipesPage').classList.remove('hidden'); 
  renderCategories();
  setViewMode('list');
}
function showFavoritesPage() { hideAll(); document.getElementById('favoritesPage').classList.remove('hidden'); renderFavorites(); }
function showAddForm() { hideAll(); resetAddForm(); document.getElementById('addForm').classList.remove('hidden'); }
function showMenuPlanPage() { hideAll(); document.getElementById('menuPlanPage').classList.remove('hidden'); renderSavedMenus(); }

// ==================== CATEGORIES ====================
function renderCategories() {
  const cats = ["Breakfast","Main Dishes","Side Dishes","Appetizers","Soups","Bread","Desserts","Salads","Pasta","Beverages","Sauces & Spices","Specialty Items"];
  const container = document.getElementById('categories');
  container.innerHTML = cats.map(cat => `
    <button onclick="filterByCategory('${cat}')" class="cat-btn px-5 py-4 bg-white hover:bg-pink-100 border border-pink-200 rounded-3xl text-center text-sm">
      ${cat}
    </button>
  `).join('');
}

function filterByCategory(cat) {
  const filtered = recipes.filter(r => r.category === cat);
  if (currentViewMode === 'list') renderRecipeList(filtered);
  else renderRecipeGrid(filtered);
}

// ==================== ADD RECIPE ====================
function resetAddForm() {
  newRecipeImages = [];
  document.getElementById('previewImages').innerHTML = '';
  document.getElementById('newTitle').value = '';
  document.getElementById('newCategory').value = '';
  document.getElementById('newTags').value = '';
  document.getElementById('newIngredients').value = '';
  document.getElementById('newInstructions').value = '';
  document.getElementById('addHeart').innerHTML = '♡';
  resetButton();
}

function resetButton() {
  const btn = document.getElementById('addRecipeBtn');
  btn.disabled = false;
  btn.innerHTML = '🍳 ADD TO FAMILY COOKBOOK';
}

function addNewRecipe() {
  if (isAdding) return;
  isAdding = true;
  const btn = document.getElementById('addRecipeBtn');
  btn.disabled = true;
  btn.innerHTML = 'Adding... 🍳';

  try {
    const title = document.getElementById('newTitle').value.trim();
    if (!title) { alert("Please enter a recipe title!"); return; }

    const category = document.getElementById('newCategory').value || "Uncategorized";
    const defaultImg = getDefaultImage(category);

    const newRecipe = {
      id: Date.now(),
      title,
      category,
      tags: document.getElementById('newTags').value.split(',').map(t => t.trim().toLowerCase()).filter(Boolean),
      ingredients: document.getElementById('newIngredients').value.split('\n').map(i => i.trim()).filter(Boolean),
      instructions: document.getElementById('newInstructions').value.split('\n').map(i => i.trim()).filter(Boolean),
      images: newRecipeImages.length > 0 ? [...newRecipeImages] : [defaultImg],
      favorite: document.getElementById('addHeart').innerHTML === '❤️',
      notes: ""
    };

    recipes.unshift(newRecipe);
    saveRecipes();
    showAddSuccess(title);
    setTimeout(() => openRecipe(newRecipe.id), 800);
  } catch (err) {
    console.error(err);
    alert("Something went wrong. Please try again.");
  } finally {
    resetButton();
    isAdding = false;
  }
}

function showAddSuccess(title) {
  const bubble = document.createElement('div');
  bubble.style.cssText = `position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);background:white;padding:25px 40px;border-radius:9999px;box-shadow:0 20px 40px rgba(0,0,0,0.3);z-index:10000;`;
  bubble.innerHTML = `👨‍🍳 Added "${title}" successfully!`;
  document.body.appendChild(bubble);
  setTimeout(() => bubble.remove(), 2200);
}

// ==================== RECIPE RENDERING ====================
function setViewMode(mode) {
  currentViewMode = mode;
  document.getElementById('btnList').classList.toggle('bg-pink-100', mode === 'list');
  document.getElementById('btnGrid').classList.toggle('bg-pink-100', mode === 'grid');
  document.getElementById('recipeListView').classList.toggle('hidden', mode !== 'list');
  document.getElementById('recipeGridView').classList.toggle('hidden', mode !== 'grid');
  if (mode === 'list') renderRecipeList();
  else renderRecipeGrid();
}

function renderRecipeList(list = recipes) {
  const container = document.getElementById('recipeListView');
  container.innerHTML = list.map(r => `
    <div onclick="openRecipe(${r.id})" class="recipe-list-item bg-white p-6 rounded-3xl shadow cursor-pointer flex gap-6 items-center">
      <img src="${r.images?.[0] || getDefaultImage(r.category)}" class="w-20 h-20 object-cover rounded-2xl">
      <div>
        <h3 class="text-2xl serif">${r.title}</h3>
        <p class="text-pink-700">${r.category}</p>
      </div>
    </div>
  `).join('') || '<p class="text-gray-500 py-12 text-center">No recipes yet. Add your first one!</p>';
}

function renderRecipeGrid(list = recipes) {
  const container = document.getElementById('recipeGridView');
  container.innerHTML = list.map(r => `
    <div onclick="openRecipe(${r.id})" class="recipe-card bg-white rounded-3xl overflow-hidden cursor-pointer">
      <img src="${r.images?.[0] || getDefaultImage(r.category)}" class="w-full h-56 object-cover">
      <div class="p-6"><h3 class="text-2xl serif">${r.title}</h3></div>
    </div>
  `).join('');
}

function openRecipe(id) {
  currentRecipe = recipes.find(r => r.id === id);
  if (!currentRecipe) return alert("Recipe not found");

  document.getElementById('singleRecipeTitle').textContent = currentRecipe.title;
  document.getElementById('singleRecipeTags').innerHTML = currentRecipe.tags?.length ? `Tags: ${currentRecipe.tags.join(', ')}` : '';
  document.getElementById('singleRecipeMainImage').src = currentRecipe.images?.[0] || getDefaultImage(currentRecipe.category);
  document.getElementById('editIngredients').value = currentRecipe.ingredients?.join('\n') || '';
  document.getElementById('editInstructions').value = currentRecipe.instructions?.join('\n') || '';
  document.getElementById('singleNotesArea').value = currentRecipe.notes || '';

  hideAll();
  document.getElementById('singleRecipePage').classList.remove('hidden');
  window.scrollTo(0, 0);
}

// Camera, OCR, Favorites, Menu, etc.
function openCamera() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*'; input.capture = 'environment';
  input.onchange = e => handleFiles(e.target.files);
  input.click();
}

function handleFiles(files) {
  Array.from(files).forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      newRecipeImages.push(e.target.result);
      renderPreviewImages();
    };
    reader.readAsDataURL(file);
  });
}

function renderPreviewImages() {
  const container = document.getElementById('previewImages');
  container.innerHTML = newRecipeImages.map((src, i) => `
    <div class="relative inline-block">
      <img src="${src}" class="w-32 h-32 object-cover rounded-2xl">
      <button onclick="newRecipeImages.splice(${i},1);renderPreviewImages()" class="absolute -top-2 -right-2 bg-red-500 text-white w-6 h-6 rounded-full text-xs">×</button>
    </div>
  `).join('');
}

async function startOCR() {
  if (newRecipeImages.length === 0) { alert("Take a photo first!"); openCamera(); return; }
  const btn = document.getElementById('ocrBtn');
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Processing...`;

  try {
    let allText = "";
    for (let src of newRecipeImages) {
      const { data } = await Tesseract.recognize(src, 'eng');
      allText += data.text + "\n";
    }
    const lines = allText.split('\n').filter(l => l.trim().length > 3);
    document.getElementById('newIngredients').value = lines.slice(0,15).join('\n');
    document.getElementById('newInstructions').value = lines.slice(15).join('\n');
    alert("✅ Autofill Complete!");
  } catch(e) { alert("OCR failed – type manually"); }
  finally { btn.disabled = false; btn.innerHTML = orig; }
}

function toggleFavoriteInAdd() {
  const heart = document.getElementById('addHeart');
  heart.innerHTML = heart.innerHTML === '♡' ? '❤️' : '♡';
}

function renderFavorites() {
  const container = document.getElementById('favoritesGrid');
  const favs = recipes.filter(r => r.favorite);
  container.innerHTML = favs.length ? favs.map(r => `
    <div onclick="openRecipe(${r.id})" class="bg-white rounded-3xl overflow-hidden cursor-pointer shadow">
      <img src="${r.images?.[0] || getDefaultImage(r.category)}" class="w-full h-56 object-cover">
      <div class="p-6"><h3 class="text-2xl serif">${r.title}</h3></div>
    </div>
  `).join('') : '<p class="text-gray-500 py-12">No favorites yet.</p>';
}

function createNewMenu() {
  const title = prompt("Menu Title", "Week of " + new Date().toLocaleDateString());
  if (!title) return;
  menus.unshift({ id: Date.now(), title, date: new Date().toISOString().split('T')[0] });
  saveMenus();
  renderSavedMenus();
  alert("New menu created!");
}

function renderSavedMenus() {
  const container = document.getElementById('savedMenusList');
  container.innerHTML = menus.map(m => `
    <div onclick="alert('Opening ${m.title}')" class="bg-white p-6 rounded-3xl shadow cursor-pointer hover:bg-pink-50">
      <h3 class="text-2xl">${m.title}</h3>
      <p class="text-pink-700">${m.date}</p>
    </div>
  `).join('') || '<p class="text-gray-500 py-8">No menus yet.</p>';
}

function saveRecipeEdits() { if (currentRecipe) { alert("Changes saved!"); } }
function saveNotes() { if (currentRecipe) { alert("Notes saved!"); } }
function deleteCurrentRecipeFromSingle() { if (confirm("Delete?")) { closeSingleRecipe(); } }
function closeSingleRecipe() { hideAll(); showRecipesPage(); }
function openImageViewer() { document.getElementById('imageViewer').classList.remove('hidden'); }
function closeImageViewer() { document.getElementById('imageViewer').classList.add('hidden'); }
function printOriginalRecipe() { window.print(); }
function filterRecipes() { /* basic search */ renderRecipeList(); }

// Initialize
window.onload = function() {
  document.getElementById('dropZone').addEventListener('click', () => document.getElementById('imageUpload').click());
  document.getElementById('imageUpload').addEventListener('change', e => handleFiles(e.target.files));
  showHome();
  console.log(`✅ Fully loaded with ${recipes.length} recipes`);
};
</script>
</body>
</html>
