<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keely & Brian's Family Recipes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body { font-family: 'Georgia', serif; background: #f9f5eb; }
    .hero { background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), url('https://picsum.photos/id/1080/2000/1200'); background-size: cover; background-position: center; }
    .recipe-card { transition: all 0.3s; }
    .recipe-card:hover { transform: scale(1.04); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.15); }
    .drop-zone { border: 3px dashed #d97706; }
  </style>
</head>
<body class="min-h-screen pb-20">

<nav class="bg-amber-900 text-white py-5 sticky top-0 z-50 shadow-md">
  <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
    <h1 class="text-3xl font-bold italic">Keely & Brian's</h1>
    <div class="flex gap-8 text-lg">
      <a href="#" onclick="showHome()" class="hover:text-amber-300">Home</a>
      <a href="#" onclick="showAllRecipes()" class="hover:text-amber-300">Recipes</a>
      <a href="#" onclick="showAddForm()" class="hover:text-amber-300 font-medium">+ Add Recipe</a>
    </div>
  </div>
</nav>

<!-- HOME -->
<div id="home" class="hero h-screen flex items-center justify-center text-center text-white">
  <div class="max-w-4xl px-6">
    <h1 class="text-6xl md:text-8xl font-serif italic tracking-wider mb-6">Keely & Brian's<br>Family Recipes</h1>
    <p class="text-3xl mb-12">Love. Tradition. Flavor.</p>
    <button onclick="showAllRecipes()" class="bg-amber-700 hover:bg-amber-600 text-xl px-12 py-5 rounded-full">Explore the Collection →</button>
  </div>
</div>

<!-- Slideshow -->
<div class="max-w-6xl mx-auto px-6 -mt-12 relative z-10">
  <div id="slideshow" class="h-96 rounded-3xl overflow-hidden shadow-2xl"></div>
</div>

<!-- Search -->
<div class="max-w-6xl mx-auto px-6 py-10">
  <input id="searchInput" type="text" placeholder="Search recipes, ingredients, or tags..." 
         class="w-full text-2xl py-6 px-8 rounded-3xl border-4 border-amber-900 focus:outline-none" onkeyup="filterRecipes()">
</div>

<!-- Categories -->
<div class="max-w-6xl mx-auto px-6">
  <h2 class="text-4xl font-serif mb-6">Categories</h2>
  <div id="categories" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
</div>

<!-- All Recipes -->
<div id="allRecipes" class="max-w-6xl mx-auto px-6 pt-8 hidden">
  <h2 class="text-4xl font-serif mb-8">Our Family Favorites</h2>
  <div id="recipeGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
</div>

<!-- ADD RECIPE FORM -->
<div id="addForm" class="max-w-2xl mx-auto px-6 pt-8 hidden">
  <h2 class="text-4xl font-serif mb-8">Add a New Family Recipe</h2>
  <div class="bg-white p-8 rounded-3xl shadow">
    <input id="newTitle" placeholder="Recipe Title *" class="w-full mb-4 p-4 border rounded-2xl text-xl">

    <!-- Camera + Upload + OCR -->
    <div class="mb-8 p-6 border-2 border-dashed border-amber-700 rounded-3xl">
      <label class="block text-lg mb-4 font-medium">📸 Scan Old Printed Recipe</label>
      
      <div class="grid grid-cols-2 gap-4">
        <button onclick="openCamera()" class="bg-amber-700 hover:bg-amber-600 text-white py-6 rounded-2xl flex flex-col items-center gap-2">
          <i class="fas fa-camera text-3xl"></i>
          <span>Take Photo</span>
        </button>
        <div id="dropZone" class="drop-zone p-6 text-center rounded-2xl cursor-pointer flex flex-col justify-center">
          <i class="fas fa-cloud-upload-alt text-3xl text-amber-700"></i>
          <span class="mt-2">Upload Photo</span>
          <input type="file" id="imageUpload" accept="image/*" class="hidden">
        </div>
      </div>

      <div id="previewImages" class="flex flex-wrap gap-3 mt-6"></div>

      <button onclick="runOCR()" class="mt-6 w-full bg-amber-800 hover:bg-amber-700 text-white py-4 rounded-2xl flex items-center justify-center gap-3">
        <i class="fas fa-magic"></i> Extract Text with OCR
      </button>
      <p id="ocrStatus" class="text-center text-sm mt-3 text-gray-600"></p>
    </div>

    <input id="newCategory" placeholder="Category (e.g. Breakfast)" class="w-full mb-4 p-4 border rounded-2xl">
    <input id="newTags" placeholder="Tags (comma separated)" class="w-full mb-4 p-4 border rounded-2xl">
    <textarea id="newIngredients" placeholder="Ingredients (one per line)" class="w-full h-40 p-4 border rounded-2xl mb-4"></textarea>
    <textarea id="newInstructions" placeholder="Instructions (one step per line)" class="w-full h-40 p-4 border rounded-2xl mb-4"></textarea>

    <button onclick="addNewRecipe()" class="w-full bg-amber-900 hover:bg-amber-800 text-white py-5 text-xl rounded-3xl">Add Recipe to Cookbook</button>
  </div>
</div>

<!-- RECIPE MODAL -->
<div id="recipeModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
  <div class="bg-white max-w-4xl w-full rounded-3xl max-h-[95vh] overflow-auto">
    <div class="p-8">
      <button onclick="closeModal()" class="float-right text-4xl leading-none hover:text-amber-700">×</button>
      <h2 id="modalTitle" class="text-4xl font-serif mb-6 pr-12"></h2>
      
      <div id="carousel" class="relative h-80 bg-gray-100 rounded-2xl mb-8 overflow-hidden"></div>

      <div class="grid md:grid-cols-2 gap-10">
        <div>
          <h3 class="text-2xl mb-4">Ingredients</h3>
          <div id="ingredientsList" class="space-y-3"></div>
          <button onclick="printShoppingList()" class="mt-6 w-full bg-amber-800 hover:bg-amber-700 text-white py-4 rounded-2xl">🛒 Print Shopping List</button>
        </div>
        <div>
          <h3 class="text-2xl mb-4">Instructions</h3>
          <div id="instructionsList" class="space-y-4 text-lg"></div>
        </div>
      </div>

      <div class="mt-12">
        <h3 class="text-2xl mb-3">Family Notes & Memories</h3>
        <textarea id="notesArea" class="w-full h-32 p-5 border-2 border-amber-200 rounded-2xl"></textarea>
        <button onclick="saveNotes()" class="mt-3 bg-amber-700 text-white px-8 py-3 rounded-xl">Save Notes</button>
      </div>

      <button onclick="printRecipe()" class="mt-10 w-full bg-amber-900 text-white py-6 text-xl rounded-3xl">🖨️ Print Full Recipe</button>
    </div>
  </div>
</div>

<script>
// ==================== DATA ====================
let recipes = JSON.parse(localStorage.getItem('keelyBrianRecipes')) || [
  { id: 1, title: "Grandma's Buttermilk Pancakes", category: "Breakfast", tags: ["pancakes","sweet"], images: ["https://picsum.photos/id/201/800/600"], ingredients: ["2 cups flour","2 tbsp sugar"], instructions: ["Mix dry","Cook on griddle"] },
  { id: 2, title: "Brian's Famous Chili", category: "Main Dishes", tags: ["chili","spicy"], images: ["https://picsum.photos/id/431/800/600"], ingredients: ["2 lbs beef"], instructions: ["Brown meat","Simmer"] }
];

let newRecipeImages = [];
let currentRecipe = null;
let currentImageIndex = 0;
let tesseractWorker = null;

// Save
function saveRecipes() {
  localStorage.setItem('keelyBrianRecipes', JSON.stringify(recipes));
}

// ==================== CAMERA & UPLOAD ====================
function openCamera() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment';
  input.onchange = e => handleFiles(e.target.files);
  input.click();
}

function setupImageUpload() {
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('imageUpload');

  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.backgroundColor = '#fef3c7'; });
  dropZone.addEventListener('dragleave', () => dropZone.style.backgroundColor = '');
  dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.style.backgroundColor = ''; handleFiles(e.dataTransfer.files); });

  fileInput.addEventListener('change', () => handleFiles(fileInput.files));
}

function handleFiles(files) {
  Array.from(files).forEach(file => {
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = e => {
      newRecipeImages.push(e.target.result);
      renderPreviewImages();
    };
    reader.readAsDataURL(file);
  });
}

function renderPreviewImages() {
  document.getElementById('previewImages').innerHTML = newRecipeImages.map((src, i) => `
    <div class="relative">
      <img src="${src}" class="w-24 h-24 object-cover rounded-xl border">
      <button onclick="removePreviewImage(${i})" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 text-xs">×</button>
    </div>
  `).join('');
}

function removePreviewImage(i) {
  newRecipeImages.splice(i, 1);
  renderPreviewImages();
}

// ==================== OCR ====================
async function runOCR() {
  if (newRecipeImages.length === 0) return alert("Please take or upload a photo first");

  const status = document.getElementById('ocrStatus');
  status.textContent = "Scanning... (first time may take 15-30 seconds)";

  if (!tesseractWorker) {
    tesseractWorker = await Tesseract.createWorker('eng');
  }

  let fullText = "";
  for (let img of newRecipeImages) {
    const result = await Tesseract.recognize(img, 'eng');
    fullText += result.data.text + "\n";
  }

  const lines = fullText.split('\n').map(l => l.trim()).filter(l => l.length > 3);
  document.getElementById('newIngredients').value = lines.slice(0, 12).join('\n');
  document.getElementById('newInstructions').value = lines.slice(12).join('\n');

  status.textContent = "✅ Text extracted! Please review and edit.";
}

// ==================== ADD RECIPE ====================
function showAddForm() {
  newRecipeImages = [];
  document.getElementById('previewImages').innerHTML = '';
  document.getElementById('addForm').classList.remove('hidden');
  document.getElementById('allRecipes').classList.add('hidden');
  document.getElementById('home').style.display = 'none';
}

function addNewRecipe() {
  const title = document.getElementById('newTitle').value.trim();
  if (!title) return alert("Recipe needs a title!");

  const newRecipe = {
    id: Date.now(),
    title: title,
    category: document.getElementById('newCategory').value.trim() || "Uncategorized",
    tags: document.getElementById('newTags').value.split(',').map(t => t.trim().toLowerCase()).filter(Boolean),
    images: newRecipeImages.length ? newRecipeImages : ["https://picsum.photos/id/201/800/600"],
    ingredients: document.getElementById('newIngredients').value.split('\n').map(i => i.trim()).filter(Boolean),
    instructions: document.getElementById('newInstructions').value.split('\n').map(i => i.trim()).filter(Boolean)
  };

  recipes.unshift(newRecipe);
  saveRecipes();
  alert(`✅ "${title}" added!`);

  // Clear form
  document.getElementById('newTitle').value = '';
  document.getElementById('newCategory').value = '';
  document.getElementById('newTags').value = '';
  document.getElementById('newIngredients').value = '';
  document.getElementById('newInstructions').value = '';
  newRecipeImages = [];

  showAllRecipes();
}

// ==================== Other Functions (Modal, Print, Search, etc.) ====================
function renderCategories() { /* ... same as before ... */ }
function renderRecipeGrid(filtered) { /* ... */ }
function openRecipe(id) { /* ... full modal logic ... */ }
function renderCarousel() { /* ... */ }
function nextImage() { /* ... */ }
function prevImage() { /* ... */ }
function printRecipe() { window.print(); }
function printShoppingList() { /* ... */ }
function saveNotes() { /* ... */ }
function filterRecipes() { /* ... */ }
function filterByCategory(cat) { /* ... */ }
function showHome() { /* ... */ }
function showAllRecipes() { /* ... */ }
function closeModal() { /* ... */ }
function startSlideshow() { /* ... */ }

// Initialize
setupImageUpload();
renderCategories();
renderRecipeGrid(recipes);
startSlideshow();
showHome();
</script>
</body>
</html>
