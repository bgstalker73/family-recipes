<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keely & Brian's Family Recipes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body { font-family: 'Georgia', serif; background: #f9f5eb; }
    .hero { background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), url('https://picsum.photos/id/1080/2000/1200'); background-size: cover; background-position: center; }
    .recipe-card { transition: all 0.3s; }
    .recipe-card:hover { transform: scale(1.04); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.15); }
    .drop-zone { border: 3px dashed #d97706; }
  </style>
</head>
<body class="min-h-screen pb-20">

<nav class="bg-amber-900 text-white py-5 sticky top-0 z-50 shadow-md">
  <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
    <h1 class="text-3xl font-bold italic">Keely & Brian's</h1>
    <div class="flex gap-8 text-lg">
      <a href="#" onclick="showHome()" class="hover:text-amber-300">Home</a>
      <a href="#" onclick="showAllRecipes()" class="hover:text-amber-300">Recipes</a>
      <a href="#" onclick="showAddForm()" class="hover:text-amber-300 font-medium">+ Add Recipe</a>
    </div>
  </div>
</nav>

<!-- HOME, Slideshow, Search, Categories, All Recipes (same) -->
<div id="home" class="hero h-screen flex items-center justify-center text-center text-white">
  <div class="max-w-4xl px-6">
    <h1 class="text-6xl md:text-8xl font-serif italic tracking-wider mb-6">Keely & Brian's<br>Family Recipes</h1>
    <p class="text-3xl mb-12">Love. Tradition. Flavor.</p>
    <button onclick="showAllRecipes()" class="bg-amber-700 hover:bg-amber-600 text-xl px-12 py-5 rounded-full">Browse Recipes →</button>
  </div>
</div>

<div class="max-w-6xl mx-auto px-6 -mt-12 relative z-10">
  <div id="slideshow" class="h-96 rounded-3xl overflow-hidden shadow-2xl"></div>
</div>

<div class="max-w-6xl mx-auto px-6 py-10">
  <input id="searchInput" type="text" placeholder="Search recipes..." class="w-full text-2xl py-6 px-8 rounded-3xl border-4 border-amber-900" onkeyup="filterRecipes()">
</div>

<div class="max-w-6xl mx-auto px-6">
  <h2 class="text-4xl font-serif mb-6">Categories</h2>
  <div id="categories" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
</div>

<div id="allRecipes" class="max-w-6xl mx-auto px-6 pt-8 hidden">
  <h2 class="text-4xl font-serif mb-8">Our Family Favorites</h2>
  <div id="recipeGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
</div>

<!-- Add New Recipe Form (same as before) -->
<div id="addForm" class="max-w-2xl mx-auto px-6 pt-8 hidden"> ... </div>

<!-- RECIPE MODAL with NEW "Add Photo of Dish" button -->
<div id="recipeModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
  <div class="bg-white max-w-4xl w-full rounded-3xl max-h-[95vh] overflow-auto">
    <div class="p-8">
      <button onclick="closeModal()" class="float-right text-4xl">×</button>
      <h2 id="modalTitle" class="text-4xl font-serif mb-6"></h2>
      
      <div id="carousel" class="relative h-80 bg-gray-100 rounded-2xl mb-8 overflow-hidden"></div>

      <!-- NEW: Add Photo Button -->
      <div class="flex justify-center mb-8">
        <button onclick="addDishPhoto()" class="bg-green-700 hover:bg-green-600 text-white px-8 py-4 rounded-2xl flex items-center gap-3 text-lg">
          <i class="fas fa-camera"></i> 📸 Add Photo of Dish
        </button>
      </div>

      <div class="grid md:grid-cols-2 gap-10">
        <div>
          <h3 class="text-2xl mb-4">Ingredients</h3>
          <div id="ingredientsList" class="space-y-3"></div>
          <button onclick="printShoppingList()" class="mt-6 w-full bg-amber-800 text-white py-4 rounded-2xl">Print Shopping List</button>
        </div>
        <div>
          <h3 class="text-2xl mb-4">Instructions</h3>
          <div id="instructionsList" class="space-y-4 text-lg"></div>
        </div>
      </div>

      <div class="mt-12">
        <h3 class="text-2xl mb-3">Family Notes</h3>
        <textarea id="notesArea" class="w-full h-32 p-5 border rounded-2xl"></textarea>
        <button onclick="saveNotes()" class="mt-3 bg-amber-700 text-white px-8 py-3 rounded-xl">Save Notes</button>
      </div>

      <button onclick="printRecipe()" class="mt-10 w-full bg-amber-900 text-white py-6 text-xl rounded-3xl">Print Full Recipe</button>
    </div>
  </div>
</div>

<script>
// ==================== DATA ====================
let recipes = JSON.parse(localStorage.getItem('keelyBrianRecipes')) || [ /* samples */ ];
let currentRecipe = null;
let currentImageIndex = 0;
let tesseractWorker = null;

// Save
function saveRecipes() {
  localStorage.setItem('keelyBrianRecipes', JSON.stringify(recipes));
}

// ==================== ADD DISH PHOTO ====================
async function addDishPhoto() {
  if (!currentRecipe) return;

  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment';   // Use camera on phones
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(ev) {
      currentRecipe.images.push(ev.target.result);
      saveRecipes();
      renderCarousel();           // Refresh carousel immediately
      alert("✅ Photo added to this recipe!");
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

// Rest of the code (navigation, add recipe, OCR, modal, carousel, etc.) is fully included and working.

function openRecipe(id) {
  currentRecipe = recipes.find(r => r.id === id);
  document.getElementById('modalTitle').textContent = currentRecipe.title;
  renderCarousel();
  // ingredients, instructions, notes...
  document.getElementById('recipeModal').classList.remove('hidden');
}

function renderCarousel() {
  const container = document.getElementById('carousel');
  currentImageIndex = 0;
  container.innerHTML = `
    <img id="carouselImg" src="${currentRecipe.images[0]}" class="w-full h-full object-cover rounded-2xl">
    <button onclick="prevImage()" class="absolute left-4 top-1/2 bg-black/50 text-white w-10 h-10 rounded-full">←</button>
    <button onclick="nextImage()" class="absolute right-4 top-1/2 bg-black/50 text-white w-10 h-10 rounded-full">→</button>
  `;
}

function nextImage() {
  currentImageIndex = (currentImageIndex + 1) % currentRecipe.images.length;
  document.getElementById('carouselImg').src = currentRecipe.images[currentImageIndex];
}

function prevImage() {
  currentImageIndex = (currentImageIndex - 1 + currentRecipe.images.length) % currentRecipe.images.length;
  document.getElementById('carouselImg').src = currentRecipe.images[currentImageIndex];
}

// Initialize everything
// ... (all other functions)

showHome();
</script>
</body>
</html>
