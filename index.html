<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keely & Brian's Family Recipes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Georgia', serif; background: #f9f5eb; }
    .hero { 
      background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                  url('PXL_20251206_224748469.jpg') center/cover no-repeat fixed;
      min-height: 100vh;
    }
  </style>
</head>
<body class="min-h-screen pb-20">

<nav class="bg-amber-900 text-white py-5 sticky top-0 z-50 shadow-md">
  <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
    <h1 class="text-3xl font-bold italic">Keely & Brian's</h1>
    <div class="flex gap-8 text-lg">
      <button onclick="showHome()" class="hover:text-amber-300">Home</button>
      <button onclick="showRecipesPage()" class="hover:text-amber-300">Recipes</button>
      <button onclick="showAddForm()" class="hover:text-amber-300 font-medium">+ Add Recipe</button>
    </div>
  </div>
</nav>

<!-- HOME -->
<div id="home" class="hero flex items-center justify-center text-center text-white">
  <div class="max-w-4xl px-6">
    <h1 class="text-6xl md:text-8xl font-serif italic tracking-wider mb-6">Keely & Brian's<br>Family Recipes</h1>
    <p class="text-3xl mb-12">Love. Tradition. Flavor.</p>
    <button onclick="showRecipesPage()" class="bg-amber-700 hover:bg-amber-600 text-xl px-12 py-5 rounded-full">View Family Favorites</button>
  </div>
</div>

<!-- RECIPES PAGE -->
<div id="recipesPage" class="max-w-6xl mx-auto px-6 py-8 hidden">
  <h2 class="text-4xl font-serif mb-8">Family Favorites</h2>
  <div id="recipeGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
</div>

<!-- ADD RECIPE PAGE -->
<div id="addForm" class="max-w-2xl mx-auto px-6 py-8 hidden">
  <h2 class="text-4xl font-serif mb-8">Add a New Family Recipe</h2>
  <div class="bg-white p-8 rounded-3xl shadow">
    <input id="newTitle" placeholder="Recipe Title *" class="w-full mb-4 p-4 border rounded-2xl text-xl">
    <select id="newCategory" class="w-full mb-4 p-4 border rounded-2xl text-lg">
      <option value="">Select Category</option>
      <option value="Breakfast">Breakfast</option>
      <option value="Appetizers">Appetizers</option>
      <option value="Salads">Salads</option>
      <option value="Soups">Soups</option>
      <option value="Pasta">Pasta</option>
      <option value="Side Dishes">Side Dishes</option>
      <option value="Bread">Bread</option>
      <option value="Main Dishes">Main Dishes</option>
      <option value="Desserts">Desserts</option>
      <option value="Beverages">Beverages</option>
      <option value="Specialty Items">Specialty Items</option>
    </select>
    <textarea id="newIngredients" placeholder="Ingredients (one per line)" class="w-full h-40 p-4 border rounded-2xl mb-4"></textarea>
    <textarea id="newInstructions" placeholder="Instructions (one step per line)" class="w-full h-40 p-4 border rounded-2xl mb-4"></textarea>

    <button onclick="addNewRecipe()" class="w-full bg-amber-900 hover:bg-amber-800 text-white py-6 text-xl rounded-3xl font-bold">
      ADD RECIPE TO COOKBOOK
    </button>
  </div>
</div>

<script>
// Data
let recipes = JSON.parse(localStorage.getItem('keelyBrianRecipes')) || [];

// Show pages
function showHome() {
  hideAll();
  document.getElementById('home').style.display = 'flex';
}

function showRecipesPage() {
  hideAll();
  document.getElementById('recipesPage').classList.remove('hidden');
  renderRecipes();
}

function showAddForm() {
  hideAll();
  document.getElementById('addForm').classList.remove('hidden');
}

function hideAll() {
  document.getElementById('home').style.display = 'none';
  document.getElementById('recipesPage').classList.add('hidden');
  document.getElementById('addForm').classList.add('hidden');
}

// Add Recipe
function addNewRecipe() {
  const title = document.getElementById('newTitle').value.trim();
  if (!title) {
    alert("Please enter a recipe title!");
    return;
  }

  const newRecipe = {
    id: Date.now(),
    title: title,
    category: document.getElementById('newCategory').value || "Uncategorized",
    ingredients: document.getElementById('newIngredients').value.split('\n').map(i => i.trim()).filter(i => i),
    instructions: document.getElementById('newInstructions').value.split('\n').map(i => i.trim()).filter(i => i)
  };

  recipes.unshift(newRecipe);
  localStorage.setItem('keelyBrianRecipes', JSON.stringify(recipes));

  alert(`✅ "${title}" has been added to your cookbook!`);

  // Clear form
  document.getElementById('newTitle').value = '';
  document.getElementById('newCategory').value = '';
  document.getElementById('newIngredients').value = '';
  document.getElementById('newInstructions').value = '';

  showRecipesPage();
}

function renderRecipes() {
  const container = document.getElementById('recipeGrid');
  if (recipes.length === 0) {
    container.innerHTML = '<p class="text-center text-xl text-gray-500 py-12">No recipes yet. Add some using the + Add Recipe button!</p>';
    return;
  }
  container.innerHTML = recipes.map(r => `
    <div class="bg-white p-6 rounded-3xl shadow">
      <h3 class="text-2xl font-serif">${r.title}</h3>
      <p class="text-amber-800 mt-2">${r.category}</p>
    </div>
  `).join('');
}

// Initialize
showHome();
</script>
</body>
</html>
