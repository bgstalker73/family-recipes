<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keely & Brian's Family Recipes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@v5.1.0/dist/tesseract.min.js"></script>
  <style>
    body { 
      font-family: 'Georgia', serif; 
      background: #f9f5eb; 
    }
    .hero { 
      background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)), 
                  url('https://picsum.photos/id/1015/2000/1200') center/cover no-repeat fixed;
      min-height: 100vh;
    }
    .recipe-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .recipe-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    }
    .drop-zone { 
      border: 3px dashed #d97706; 
      transition: all 0.3s;
    }
    .drop-zone.dragover {
      background: #fefce8;
      border-color: #854d0e;
    }
  </style>
</head>
<body class="min-h-screen pb-20">

<nav class="bg-amber-900 text-white py-5 sticky top-0 z-50 shadow-md">
  <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
    <h1 onclick="showHome()" class="text-3xl font-bold italic cursor-pointer">Keely & Brian's</h1>
    <div class="flex gap-8 text-lg">
      <button onclick="showHome()" class="hover:text-amber-300 transition-colors">Home</button>
      <button onclick="showRecipesPage()" class="hover:text-amber-300 transition-colors">Recipes</button>
      <button onclick="showAddForm()" class="hover:text-amber-300 font-medium transition-colors">+ Add Recipe</button>
    </div>
  </div>
</nav>

<!-- HOME -->
<div id="home" class="hero flex items-center justify-center text-center text-white">
  <div class="max-w-4xl px-6">
    <h1 class="text-6xl md:text-8xl font-serif italic tracking-wider mb-6">Keely & Brian's<br>Family Recipes</h1>
    <p class="text-3xl mb-12">Love. Tradition. Flavor.</p>
    <button onclick="showRecipesPage()" class="bg-amber-700 hover:bg-amber-600 text-xl px-12 py-5 rounded-full transition-all active:scale-95">
      Browse Family Favorites
    </button>
  </div>
</div>

<!-- RECIPES PAGE -->
<div id="recipesPage" class="max-w-6xl mx-auto px-6 py-8 hidden">
  <div class="flex flex-col md:flex-row gap-4 mb-8">
    <input id="searchInput" type="text" placeholder="Search recipes..." 
           class="flex-1 text-2xl py-6 px-8 rounded-3xl border-4 border-amber-900 focus:outline-none focus:border-amber-700"
           onkeyup="filterRecipes()">
    <button onclick="showAllRecipes()" class="bg-amber-900 hover:bg-amber-800 text-white px-8 py-6 rounded-3xl text-lg whitespace-nowrap">
      All Recipes
    </button>
  </div>

  <h2 class="text-4xl font-serif mb-6">Categories</h2>
  <div id="categories" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-12"></div>

  <h2 class="text-4xl font-serif mb-6">All Recipes</h2>
  <div id="recipeGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
</div>

<!-- ADD RECIPE PAGE -->
<div id="addForm" class="max-w-2xl mx-auto px-6 py-8 hidden">
  <h2 class="text-4xl font-serif mb-8">Add a New Family Recipe</h2>
  <div class="bg-white p-8 rounded-3xl shadow-xl">
    <input id="newTitle" placeholder="Recipe Title *" 
           class="w-full mb-6 p-5 border-2 border-amber-900 rounded-3xl text-2xl focus:outline-none focus:border-amber-700">

    <!-- Camera + Upload -->
    <div class="mb-8 p-8 border-2 border-dashed border-amber-700 rounded-3xl bg-amber-50">
      <label class="block text-xl mb-5 font-medium text-amber-900">📸 Photo of Recipe Card (Optional)</label>
      <div class="grid grid-cols-2 gap-4">
        <button onclick="openCamera()" 
                class="bg-amber-700 hover:bg-amber-600 text-white py-8 rounded-3xl flex flex-col items-center gap-3 transition-all active:scale-95">
          <i class="fas fa-camera text-4xl"></i>
          <span class="text-lg font-medium">Take Photo</span>
        </button>
        <div id="dropZone" 
             class="drop-zone p-8 text-center rounded-3xl cursor-pointer flex flex-col justify-center items-center hover:bg-amber-100">
          <i class="fas fa-cloud-upload-alt text-4xl text-amber-700"></i>
          <span class="mt-3 text-lg font-medium">Upload Photo</span>
          <input type="file" id="imageUpload" accept="image/*" class="hidden">
        </div>
      </div>
      
      <div id="previewImages" class="flex flex-wrap gap-4 mt-8"></div>
      
      <!-- Loading Indicator -->
      <div id="imageLoading" class="hidden text-center text-amber-700 mt-4">
        <i class="fas fa-spinner fa-spin mr-2"></i>
        Processing photo...
      </div>

      <button onclick="runOCR()" 
              class="mt-8 w-full bg-amber-800 hover:bg-amber-700 text-white py-5 rounded-3xl font-medium text-lg transition-all">
        ✨ Extract Text with OCR
      </button>
      <p id="ocrStatus" class="text-center text-sm mt-4 text-gray-600 min-h-[1.25rem]"></p>
    </div>

    <select id="newCategory" class="w-full mb-6 p-5 border-2 border-amber-900 rounded-3xl text-xl focus:outline-none focus:border-amber-700">
      <option value="">Select Category</option>
      <option value="Breakfast">Breakfast</option>
      <option value="Appetizers">Appetizers</option>
      <option value="Salads">Salads</option>
      <option value="Soups">Soups</option>
      <option value="Pasta">Pasta</option>
      <option value="Side Dishes">Side Dishes</option>
      <option value="Bread">Bread</option>
      <option value="Main Dishes">Main Dishes</option>
      <option value="Desserts">Desserts</option>
      <option value="Beverages">Beverages</option>
      <option value="Specialty Items">Specialty Items</option>
    </select>

    <textarea id="newIngredients" placeholder="Ingredients (one per line)" 
              class="w-full h-52 p-5 border-2 border-amber-900 rounded-3xl mb-6 text-lg focus:outline-none focus:border-amber-700"></textarea>
    <textarea id="newInstructions" placeholder="Instructions (one step per line)" 
              class="w-full h-52 p-5 border-2 border-amber-900 rounded-3xl mb-8 text-lg focus:outline-none focus:border-amber-700"></textarea>

    <button onclick="addNewRecipe()" 
            class="w-full bg-amber-900 hover:bg-amber-800 text-white py-7 text-2xl rounded-3xl font-bold transition-all active:scale-95">
      ADD RECIPE TO COOKBOOK
    </button>
  </div>
</div>

<!-- RECIPE DETAIL MODAL -->
<div id="recipeModal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center z-[100] p-4">
  <div class="bg-white max-w-2xl w-full max-h-[90vh] overflow-auto rounded-3xl shadow-2xl">
    <div class="sticky top-0 bg-white border-b p-6 flex justify-between items-center z-10">
      <h2 id="modalTitle" class="text-3xl font-serif"></h2>
      <button onclick="closeModal()" class="text-4xl leading-none text-gray-400 hover:text-gray-600">&times;</button>
    </div>
    <div id="modalContent" class="p-8"></div>
  </div>
</div>

<script>
// ==================== DATA & STATE ====================
let recipes = JSON.parse(localStorage.getItem('keelyBrianRecipes')) || [];
let newRecipeImages = [];
let tesseractWorker = null;
let isProcessingImage = false;

// ==================== NAVIGATION ====================
function hideAll() {
  document.getElementById('home').style.display = 'none';
  document.getElementById('recipesPage').classList.add('hidden');
  document.getElementById('addForm').classList.add('hidden');
}

function showHome() {
  hideAll();
  document.getElementById('home').style.display = 'flex';
}

function showRecipesPage() {
  hideAll();
  document.getElementById('recipesPage').classList.remove('hidden');
  renderRecipeGrid(recipes);
}

function showAddForm() {
  hideAll();
  newRecipeImages = [];
  document.getElementById('previewImages').innerHTML = '';
  document.getElementById('imageLoading').classList.add('hidden');
  document.getElementById('ocrStatus').textContent = '';
  document.getElementById('addForm').classList.remove('hidden');
}

// ==================== CAMERA & UPLOAD (FIXED) ====================
function openCamera() {
  console.log("📸 openCamera called");
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment';
  input.style.display = 'none';
  
  document.body.appendChild(input);

  input.onchange = (e) => {
    console.log("📸 Photo captured, processing...");
    handleFiles(e.target.files);
    document.body.removeChild(input);
  };

  setTimeout(() => input.click(), 50);
}

function setupImageUpload() {
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('imageUpload');

  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => handleFiles(e.target.files));

  // Drag & Drop
  dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    handleFiles(e.dataTransfer.files);
  });
}

function handleFiles(files) {
  if (!files || files.length === 0) return;

  isProcessingImage = true;
  document.getElementById('imageLoading').classList.remove('hidden');

  let processed = 0;
  const total = files.length;

  Array.from(files).forEach(file => {
    if (!file.type.startsWith('image/')) return;

    const reader = new FileReader();
    reader.onload = (e) => {
      newRecipeImages.push(e.target.result);
      renderPreviewImages();
      processed++;

      if (processed === total) {
        isProcessingImage = false;
        document.getElementById('imageLoading').classList.add('hidden');
        console.log(`✅ All ${total} image(s) loaded successfully`);
      }
    };
    reader.onerror = () => {
      console.error("❌ FileReader error");
      alert("Failed to read the image file");
      document.getElementById('imageLoading').classList.add('hidden');
      isProcessingImage = false;
    };
    reader.readAsDataURL(file);
  });
}

function renderPreviewImages() {
  const container = document.getElementById('previewImages');
  container.innerHTML = newRecipeImages.map((src, i) => `
    <div class="relative group">
      <img src="${src}" class="w-28 h-28 object-cover rounded-2xl shadow-md">
      <button onclick="removePreviewImage(${i}); event.stopImmediatePropagation()" 
              class="absolute -top-2 -right-2 bg-red-500 hover:bg-red-600 text-white rounded-full w-7 h-7 flex items-center justify-center text-xl shadow">
        ×
      </button>
    </div>
  `).join('');
}

function removePreviewImage(i) {
  newRecipeImages.splice(i, 1);
  renderPreviewImages();
}

// ==================== OCR ====================
async function runOCR() {
  if (newRecipeImages.length === 0) {
    alert("Please take or upload at least one photo first");
    return;
  }
  // ... (OCR code remains unchanged)
  const status = document.getElementById('ocrStatus');
  status.textContent = "🔄 Initializing OCR...";

  try {
    if (!tesseractWorker) {
      tesseractWorker = await Tesseract.createWorker('eng', 1, { logger: m => console.log(m) });
    }

    status.textContent = "📸 Scanning images...";
    let fullText = "";

    for (let i = 0; i < newRecipeImages.length; i++) {
      status.textContent = `Scanning image ${i + 1} of ${newRecipeImages.length}...`;
      const result = await tesseractWorker.recognize(newRecipeImages[i]);
      fullText += result.data.text + "\n\n";
    }

    const lines = fullText.split('\n').map(l => l.trim()).filter(l => l.length > 2);
    
    document.getElementById('newIngredients').value = lines.slice(0, 15).join('\n');
    document.getElementById('newInstructions').value = lines.slice(15).join('\n');
    
    status.textContent = "✅ Text extracted successfully!";
    setTimeout(() => status.textContent = "", 4000);
  } catch (err) {
    console.error(err);
    status.textContent = "❌ OCR failed. Try again.";
  }
}

// ==================== ADD RECIPE (ROBUST) ====================
function addNewRecipe() {
  const title = document.getElementById('newTitle').value.trim();
  if (!title) {
    alert("Please enter a recipe title!");
    return;
  }

  if (isProcessingImage) {
    alert("⏳ Please wait until the photo has finished processing.");
    return;
  }

  if (newRecipeImages.length === 0) {
    const shouldContinue = confirm("No photo was added. Save recipe without image?");
    if (!shouldContinue) return;
  }

  const newRecipe = {
    id: Date.now(),
    title: title,
    category: document.getElementById('newCategory').value || "Uncategorized",
    ingredients: document.getElementById('newIngredients').value
      .split('\n').map(i => i.trim()).filter(Boolean),
    instructions: document.getElementById('newInstructions').value
      .split('\n').map(i => i.trim()).filter(Boolean),
    images: newRecipeImages.length ? [...newRecipeImages] : ["https://picsum.photos/id/201/800/600"]
  };

  try {
    recipes.unshift(newRecipe);
    localStorage.setItem('keelyBrianRecipes', JSON.stringify(recipes));
    
    alert(`✅ "${title}" added successfully!`);
    
    // Reset form
    newRecipeImages = [];
    document.getElementById('previewImages').innerHTML = '';
    document.getElementById('newTitle').value = '';
    document.getElementById('newIngredients').value = '';
    document.getElementById('newInstructions').value = '';
    document.getElementById('imageLoading').classList.add('hidden');
    
    showRecipesPage();
  } catch (err) {
    console.error("Save error:", err);
    alert("❌ Failed to save recipe. Please try again.");
  }
}

// ==================== RENDERING & OTHER FUNCTIONS ====================
function renderCategories() {
  const cats = ["Breakfast", "Appetizers", "Salads", "Soups", "Pasta", "Side Dishes", 
                "Bread", "Main Dishes", "Desserts", "Beverages", "Specialty Items"];
  document.getElementById('categories').innerHTML = cats.map(cat => `
    <div onclick="filterByCategory('${cat}')" 
         class="bg-white p-6 rounded-3xl text-center cursor-pointer hover:bg-amber-50 border border-amber-900 transition-all hover:border-amber-700">
      <h3 class="text-2xl font-medium">${cat}</h3>
    </div>
  `).join('');
}

function renderRecipeGrid(list) {
  const grid = document.getElementById('recipeGrid');
  if (list.length === 0) {
    grid.innerHTML = `<p class="col-span-full text-center text-2xl py-20 text-gray-500">No recipes found.</p>`;
    return;
  }

  grid.innerHTML = list.map(r => `
    <div onclick="showRecipeDetail(${r.id})" class="recipe-card bg-white p-6 rounded-3xl shadow cursor-pointer overflow-hidden">
      <div class="relative h-48 mb-5 -mx-6 -mt-6">
        <img src="${r.images[0]}" class="w-full h-full object-cover">
        <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/70 to-transparent h-24"></div>
      </div>
      <h3 class="text-2xl font-medium mb-1 line-clamp-2">${r.title}</h3>
      <p class="text-amber-800 font-medium">${r.category}</p>
      <div class="mt-4 text-sm text-gray-500">
        ${r.ingredients.length} ingredients • ${r.instructions.length} steps
      </div>
    </div>
  `).join('');
}

function showRecipeDetail(id) {
  const recipe = recipes.find(r => r.id === id);
  if (!recipe) return;

  document.getElementById('modalTitle').textContent = recipe.title;
  let html = `
    <div class="flex gap-2 flex-wrap mb-8">
      ${recipe.images.map(src => `<img src="${src}" class="max-h-64 rounded-2xl shadow object-cover">`).join('')}
    </div>
    <div class="mb-8">
      <h4 class="uppercase tracking-widest text-amber-800 text-sm mb-3">Ingredients</h4>
      <ul class="list-disc pl-6 space-y-2 text-lg">${recipe.ingredients.map(ing => `<li>${ing}</li>`).join('')}</ul>
    </div>
    <div>
      <h4 class="uppercase tracking-widest text-amber-800 text-sm mb-3">Instructions</h4>
      <ol class="list-decimal pl-6 space-y-4 text-lg">${recipe.instructions.map(step => `<li>${step}</li>`).join('')}</ol>
    </div>
  `;
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('recipeModal').classList.remove('hidden');
  document.getElementById('recipeModal').classList.add('flex');
}

function closeModal() {
  const modal = document.getElementById('recipeModal');
  modal.classList.add('hidden');
  modal.classList.remove('flex');
}

function filterByCategory(cat) {
  const filtered = recipes.filter(r => r.category === cat);
  renderRecipeGrid(filtered);
}

function filterRecipes() {
  const term = document.getElementById('searchInput').value.toLowerCase().trim();
  if (!term) return renderRecipeGrid(recipes);
  const filtered = recipes.filter(r => 
    r.title.toLowerCase().includes(term) || 
    r.ingredients.some(i => i.toLowerCase().includes(term)) ||
    r.category.toLowerCase().includes(term)
  );
  renderRecipeGrid(filtered);
}

function showAllRecipes() {
  document.getElementById('searchInput').value = '';
  renderRecipeGrid(recipes);
}

// ==================== INITIALIZE ====================
function init() {
  setupImageUpload();
  renderCategories();
  showHome();
}

window.onload = init;
</script>
</body>
</html>
