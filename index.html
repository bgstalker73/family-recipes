<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keely & Brian's Family Recipes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Georgia', serif; background: #f9f5eb; }
    .hero { 
      background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                  url('IMG_9206.JPEG') center/cover no-repeat fixed;
      min-height: 100vh;
    }
    .heart { cursor: pointer; font-size: 2.2rem; transition: all 0.2s; }
    .heart:hover { transform: scale(1.3); }
    .recipe-card { transition: all 0.3s; cursor: pointer; }
    .recipe-card:hover { transform: scale(1.04); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.15); }
    .drop-zone { border: 3px dashed #d97706; }

    /* Full-screen image viewer */
    #imageViewer {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    #viewerImage {
      max-width: 100%;
      max-height: 95vh;
      object-fit: contain;
      border-radius: 12px;
    }
  </style>
</head>
<body class="min-h-screen pb-20">

<nav class="bg-amber-900 text-white py-4 sticky top-0 z-50 shadow-md">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 flex justify-start items-center gap-4 sm:gap-8">
    <h1 class="text-2xl sm:text-3xl font-bold italic">Keely & Brian's</h1>
    <div class="flex flex-wrap gap-3 sm:gap-6 text-base sm:text-lg">
      <button onclick="showHome()" class="hover:text-amber-300 whitespace-nowrap">Home</button>
      <button onclick="showRecipesPage()" class="hover:text-amber-300 whitespace-nowrap">Recipes</button>
      <button onclick="showFavoritesPage()" class="hover:text-amber-300 whitespace-nowrap">Favs ❤️</button>
      <button onclick="showAddForm()" class="hover:text-amber-300 font-medium whitespace-nowrap">+ Add Recipe</button>
    </div>
  </div>
</nav>

<!-- HOME -->
<div id="home" class="hero flex items-center justify-center text-center text-white">
  <div class="max-w-4xl px-6">
    <h1 class="text-5xl md:text-7xl font-serif italic tracking-wider mb-6">Keely & Brian's<br>Family Recipes</h1>
    <p class="text-2xl md:text-3xl mb-12">Love. Tradition. Flavor.</p>
    <button onclick="showFavoritesPage()" class="bg-amber-700 hover:bg-amber-600 text-xl px-10 py-5 rounded-full">Family Favorites ❤️</button>
  </div>
</div>

<!-- FAMILY FAVORITES -->
<div id="favoritesPage" class="max-w-6xl mx-auto px-4 sm:px-6 py-8 hidden">
  <h2 class="text-4xl font-serif mb-6">Most Recent Family Favorites ❤️</h2>
  <div id="favoritesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
</div>

<!-- RECIPES PAGE -->
<div id="recipesPage" class="max-w-6xl mx-auto px-4 sm:px-6 py-8 hidden">
  <input id="searchInput" type="text" placeholder="Search recipes or tags..." 
         class="w-full text-xl sm:text-2xl py-5 px-6 rounded-3xl border-4 border-amber-900 mb-8" onkeyup="filterRecipes()">
  <h2 class="text-4xl font-serif mb-6">Categories</h2>
  <div id="categories" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
  <div id="recipeGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mt-10"></div>
</div>

<!-- ADD RECIPE PAGE -->
<div id="addForm" class="max-w-2xl mx-auto px-4 sm:px-6 py-8 hidden">
  <h2 class="text-4xl font-serif mb-8">Add a New Family Recipe</h2>
  <div class="bg-white p-8 rounded-3xl shadow">
    <div class="flex items-center gap-3 mb-6">
      <button onclick="toggleFavoriteInAdd()" id="addHeart" class="heart text-red-500">♡</button>
      <input id="newTitle" placeholder="Recipe Title *" class="flex-1 p-4 border rounded-2xl text-xl">
    </div>

    <select id="newCategory" class="w-full mb-6 p-4 border rounded-2xl text-lg">
      <option value="">Select Category</option>
      <option value="Main Dishes">Main Dishes</option>
      <option value="Side Dishes">Side Dishes</option>
      <option value="Appetizers">Appetizers</option>
      <option value="Soups">Soups</option>
      <option value="Bread">Bread</option>
      <option value="Desserts">Desserts</option>
      <option value="Salads">Salads</option>
      <option value="Pasta">Pasta</option>
      <option value="Beverages">Beverages</option>
      <option value="Breakfast">Breakfast</option>
      <option value="Specialty Items">Specialty Items</option>
    </select>

    <input id="newTags" placeholder="Tags (comma separated)" class="w-full p-4 border rounded-2xl mb-8 text-lg">

    <div class="mb-8 p-6 border-2 border-dashed border-amber-700 rounded-3xl">
      <label class="block text-lg mb-4 font-medium">📸 Add Recipe Photo</label>
      <div class="grid grid-cols-2 gap-4">
        <button onclick="openCamera()" class="bg-amber-700 hover:bg-amber-600 text-white py-6 rounded-2xl flex flex-col items-center gap-2">
          <i class="fas fa-camera text-3xl"></i><span>Take Photo</span>
        </button>
        <div id="dropZone" class="drop-zone p-6 text-center rounded-2xl cursor-pointer flex flex-col justify-center">
          <i class="fas fa-cloud-upload-alt text-3xl text-amber-700"></i>
          <span class="mt-2">Upload Photo</span>
          <input type="file" id="imageUpload" accept="image/*" class="hidden">
        </div>
      </div>
      <div id="previewImages" class="flex flex-wrap gap-3 mt-6"></div>
    </div>

    <textarea id="newIngredients" placeholder="Ingredients (one per line)" class="w-full h-40 p-4 border rounded-2xl mb-6"></textarea>
    <textarea id="newInstructions" placeholder="Instructions (one step per line)" class="w-full h-40 p-4 border rounded-2xl mb-8"></textarea>

    <button onclick="addNewRecipe()" class="w-full bg-amber-900 hover:bg-amber-800 text-white py-6 text-xl rounded-3xl font-bold">
      ADD RECIPE TO COOKBOOK
    </button>
  </div>
</div>

<!-- SINGLE RECIPE PAGE -->
<div id="singleRecipePage" class="max-w-4xl mx-auto px-4 sm:px-6 py-8 hidden">
  <button onclick="closeSingleRecipe()" class="mb-6 text-2xl hover:text-amber-700 flex items-center gap-2">← Back to Recipes</button>
  
  <div class="bg-white rounded-3xl shadow overflow-hidden">
    <div class="relative bg-gray-100">
      <img id="singleRecipeMainImage" class="w-full h-80 sm:h-96 object-cover cursor-pointer" onclick="showImageViewer(this.src)">
    </div>
    
    <div class="p-8">
      <div class="flex items-center gap-4 mb-4">
        <h2 id="singleRecipeTitle" class="text-4xl font-serif flex-1"></h2>
        <button onclick="toggleFavoriteInSingle()" id="singleHeart" class="heart text-red-500">♡</button>
      </div>
      <div id="singleRecipeTags" class="text-amber-700 mb-6"></div>

      <div class="grid md:grid-cols-2 gap-10">
        <div>
          <h3 class="text-2xl mb-4">Ingredients</h3>
          <div id="singleIngredientsList" class="space-y-3"></div>
        </div>
        <div>
          <h3 class="text-2xl mb-4">Instructions</h3>
          <div id="singleInstructionsList" class="space-y-4 text-lg"></div>
        </div>
      </div>

      <div class="mt-12">
        <h3 class="text-2xl mb-3">Family Notes & Memories</h3>
        <textarea id="singleNotesArea" class="w-full h-32 p-5 border-2 border-amber-200 rounded-2xl"></textarea>
        <button onclick="saveNotes()" class="mt-3 bg-amber-700 text-white px-8 py-3 rounded-xl">Save Notes</button>
      </div>

      <button onclick="printIngredientsAndInstructions()" class="mt-6 w-full bg-amber-800 hover:bg-amber-700 text-white py-4 rounded-2xl">
        🖨️ Print Ingredients & Instructions
      </button>
      <button onclick="printOriginalRecipe()" class="mt-4 w-full bg-amber-900 text-white py-6 text-xl rounded-3xl">
        🖨️ Print Original Recipe (with uploaded image)
      </button>

      <button onclick="deleteCurrentRecipeFromSingle()" class="mt-4 w-full bg-red-700 hover:bg-red-600 text-white py-4 rounded-2xl text-lg">
        🗑️ Delete This Recipe
      </button>
    </div>
  </div>
</div>

<!-- Full-screen Image Viewer -->
<div id="imageViewer">
  <div class="relative max-w-full">
    <button onclick="closeImageViewer()" class="absolute -top-10 right-4 text-white text-2xl hover:text-amber-300 flex items-center gap-2">
      ✕ Close
    </button>
    <img id="viewerImage" src="" alt="Recipe Image">
  </div>
</div>

<script>
// Data
let recipes = JSON.parse(localStorage.getItem('keelyBrianRecipes')) || [];
let newRecipeImages = [];
let currentRecipe = null;

// Default images
const categoryImages = {
  "Breakfast": "https://picsum.photos/id/1080/800/600",
  "Appetizers": "https://picsum.photos/id/292/800/600",
  "Salads": "https://picsum.photos/id/431/800/600",
  "Soups": "https://picsum.photos/id/669/800/600",
  "Pasta": "https://picsum.photos/id/201/800/600",
  "Side Dishes": "https://picsum.photos/id/312/800/600",
  "Bread": "https://picsum.photos/id/870/800/600",
  "Main Dishes": "https://picsum.photos/id/1060/800/600",
  "Desserts": "https://picsum.photos/id/1083/800/600",
  "Beverages": "https://picsum.photos/id/133/800/600",
  "Specialty Items": "https://picsum.photos/id/292/800/600"
};

function getDefaultImage(cat) {
  return categoryImages[cat] || "https://picsum.photos/id/1080/800/600";
}

function saveRecipes() {
  localStorage.setItem('keelyBrianRecipes', JSON.stringify(recipes));
}

// Navigation
function showHome() { hideAll(); document.getElementById('home').style.display = 'flex'; }
function showRecipesPage() { 
  hideAll(); 
  document.getElementById('recipesPage').classList.remove('hidden'); 
  renderRecipeGrid(recipes); 
  renderCategories();
}
function showFavoritesPage() { 
  hideAll(); 
  document.getElementById('favoritesPage').classList.remove('hidden'); 
  renderFavorites(); 
}
function showAddForm() { 
  hideAll(); 
  newRecipeImages = []; 
  document.getElementById('addHeart').innerHTML = '♡';
  document.getElementById('previewImages').innerHTML = '';
  document.getElementById('newTitle').value = '';
  document.getElementById('newCategory').value = '';
  document.getElementById('newTags').value = '';
  document.getElementById('newIngredients').value = '';
  document.getElementById('newInstructions').value = '';
  document.getElementById('addForm').classList.remove('hidden'); 
}

function hideAll() {
  document.getElementById('home').style.display = 'none';
  document.getElementById('recipesPage').classList.add('hidden');
  document.getElementById('favoritesPage').classList.add('hidden');
  document.getElementById('addForm').classList.add('hidden');
  document.getElementById('singleRecipePage').classList.add('hidden');
}

// Image handling
function openCamera() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment';
  input.onchange = e => handleFiles(e.target.files);
  input.click();
}

function setupImageUpload() {
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('imageUpload');
  if (!dropZone || !fileInput) return;
  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => handleFiles(fileInput.files));
}

function handleFiles(files) {
  Array.from(files).forEach(file => {
    const reader = new FileReader();
    reader.onload = e => newRecipeImages.push(e.target.result);
    reader.readAsDataURL(file);
  });
  // Render after all files
  setTimeout(renderPreviewImages, 100);
}

function renderPreviewImages() {
  const container = document.getElementById('previewImages');
  if (!container) return;
  container.innerHTML = newRecipeImages.map((src, i) => `
    <div class="relative inline-block">
      <img src="${src}" class="w-24 h-24 object-cover rounded-xl cursor-pointer" onclick="showImageViewer('${src}')">
      <button onclick="removePreviewImage(${i}); event.stopImmediatePropagation()" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 text-xs">×</button>
    </div>
  `).join('');
}

function removePreviewImage(i) {
  newRecipeImages.splice(i, 1);
  renderPreviewImages();
}

function showImageViewer(src) {
  document.getElementById('viewerImage').src = src;
  document.getElementById('imageViewer').style.display = 'flex';
}

function closeImageViewer() {
  document.getElementById('imageViewer').style.display = 'none';
}

// Add Recipe
function addNewRecipe() {
  const title = document.getElementById('newTitle').value.trim();
  if (!title) return alert("Please enter a recipe title!");

  const category = document.getElementById('newCategory').value || "Uncategorized";

  const newRecipe = {
    id: Date.now(),
    title: title,
    category: category,
    tags: document.getElementById('newTags').value.split(',').map(t => t.trim().toLowerCase()).filter(Boolean),
    ingredients: document.getElementById('newIngredients').value.split('\n').map(i => i.trim()).filter(Boolean),
    instructions: document.getElementById('newInstructions').value.split('\n').map(i => i.trim()).filter(Boolean),
    images: newRecipeImages.length ? newRecipeImages : [getDefaultImage(category)],
    favorite: document.getElementById('addHeart').innerHTML === '❤️'
  };

  recipes.unshift(newRecipe);
  saveRecipes();
  alert(`✅ "${title}" has been added!`);
  showRecipesPage();
}

// SINGLE RECIPE PAGE
function openRecipe(id) {
  currentRecipe = recipes.find(r => r.id === id);
  if (!currentRecipe) return alert("Recipe not found");

  document.getElementById('singleRecipeTitle').textContent = currentRecipe.title;
  document.getElementById('singleRecipeTags').innerHTML = currentRecipe.tags && currentRecipe.tags.length ? 
    `Tags: ${currentRecipe.tags.join(', ')}` : '';

  const imgSrc = currentRecipe.images && currentRecipe.images[0] ? currentRecipe.images[0] : getDefaultImage(currentRecipe.category);
  document.getElementById('singleRecipeMainImage').src = imgSrc;

  document.getElementById('singleIngredientsList').innerHTML = currentRecipe.ingredients.map(i => `<div class="text-lg">• ${i}</div>`).join('');
  document.getElementById('singleInstructionsList').innerHTML = currentRecipe.instructions.map((step, i) => `<div>${i+1}. ${step}</div>`).join('');

  hideAll();
  document.getElementById('singleRecipePage').classList.remove('hidden');
}

function closeSingleRecipe() {
  document.getElementById('singleRecipePage').classList.add('hidden');
  showRecipesPage();
}

function toggleFavoriteInSingle() {
  if (!currentRecipe) return;
  currentRecipe.favorite = !currentRecipe.favorite;
  document.getElementById('singleHeart').innerHTML = currentRecipe.favorite ? '❤️' : '♡';
  saveRecipes();
}

function deleteCurrentRecipeFromSingle() {
  if (!currentRecipe) return;
  if (!confirm(`Delete "${currentRecipe.title}" permanently?`)) return;
  recipes = recipes.filter(r => r.id !== currentRecipe.id);
  saveRecipes();
  alert("Recipe deleted.");
  closeSingleRecipe();
}

// Print functions
function printIngredientsAndInstructions() {
  if (!currentRecipe) return;
  const win = window.open('', '', 'height=700,width=600');
  win.document.write(`
    <h1 style="text-align:center">${currentRecipe.title}</h1>
    <h2>Ingredients</h2><ul>${currentRecipe.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>
    <h2>Instructions</h2><ol>${currentRecipe.instructions.map((step, i) => `<li>${step}</li>`).join('')}</ol>
  `);
  win.document.close();
  win.print();
}

function printOriginalRecipe() {
  if (!currentRecipe) return;
  const win = window.open('', '', 'height=900,width=700');
  const imgSrc = currentRecipe.images && currentRecipe.images[0] ? currentRecipe.images[0] : getDefaultImage(currentRecipe.category);
  win.document.write(`
    <h1 style="text-align:center; margin:20px;">${currentRecipe.title}</h1>
    <img src="${imgSrc}" style="max-width:100%; height:auto; display:block; margin:20px auto; border:1px solid #ddd;">
  `);
  win.document.close();
  win.print();
}

// Render functions
function renderCategories() {
  const cats = ["Main Dishes", "Side Dishes", "Appetizers", "Soups", "Bread", 
                "Desserts", "Salads", "Pasta", "Beverages", "Breakfast", "Specialty Items"];
  document.getElementById('categories').innerHTML = cats.map(cat => `
    <div onclick="filterByCategory('${cat}')" class="bg-white p-4 rounded-3xl text-center cursor-pointer hover:bg-amber-50 border border-amber-900">
      <h3 class="text-xl">${cat}</h3>
    </div>
  `).join('');
}

function renderRecipeGrid(list) {
  document.getElementById('recipeGrid').innerHTML = list.map(r => {
    const imgSrc = r.images && r.images[0] ? r.images[0] : getDefaultImage(r.category);
    return `
      <div onclick="openRecipe(${r.id})" class="recipe-card bg-white rounded-3xl overflow-hidden cursor-pointer border border-amber-900">
        <img src="${imgSrc}" class="w-full h-56 object-cover">
        <div class="p-6">
          <h3 class="text-2xl font-serif">${r.title}</h3>
        </div>
      </div>
    `;
  }).join('');
}

function renderFavorites() {
  const favorites = recipes.filter(r => r.favorite).sort((a,b) => b.id - a.id);
  const container = document.getElementById('favoritesGrid');
  container.innerHTML = favorites.length ? favorites.map(r => {
    const imgSrc = r.images && r.images[0] ? r.images[0] : getDefaultImage(r.category);
    return `
      <div onclick="openRecipe(${r.id})" class="bg-white p-6 rounded-3xl shadow cursor-pointer">
        <img src="${imgSrc}" class="w-full h-48 object-cover rounded-2xl mb-4">
        <h3 class="text-2xl">${r.title}</h3>
        <p class="text-amber-800">${r.category}</p>
      </div>
    `;
  }).join('') : '<p class="text-center text-xl py-12 text-gray-500">No favorites yet. ❤️ a recipe when adding it!</p>';
}

function filterByCategory(cat) {
  const filtered = recipes.filter(r => r.category === cat);
  renderRecipeGrid(filtered);
}

function filterRecipes() {
  const term = document.getElementById('searchInput').value.toLowerCase();
  const filtered = recipes.filter(r => 
    r.title.toLowerCase().includes(term) || 
    (r.tags && r.tags.some(tag => tag.includes(term)))
  );
  renderRecipeGrid(filtered);
}

// Initialize
window.onload = function() {
  setupImageUpload();
  renderCategories();
  showHome();
};
</script>
</body>
</html>
