<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keely & Brian's Family Recipes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Georgia', serif; background: #f9f5eb; }
    .hero { 
      background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                  url('PXL_20251206_224748469.jpg') center/cover no-repeat fixed;
      min-height: 100vh;
    }
    .category-card { transition: all 0.3s; }
    .category-card:hover { transform: scale(1.05); }
  </style>
</head>
<body class="min-h-screen pb-20">

<nav class="bg-amber-900 text-white py-5 sticky top-0 z-50 shadow-md">
  <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
    <h1 class="text-3xl font-bold italic">Keely & Brian's</h1>
    <div class="flex gap-8 text-lg">
      <button onclick="showHome()" class="hover:text-amber-300">Home</button>
      <button onclick="showAllRecipes()" class="hover:text-amber-300">Recipes</button>
      <button onclick="showAddForm()" class="hover:text-amber-300 font-medium">+ Add Recipe</button>
    </div>
  </div>
</nav>

<!-- HOME -->
<div id="home" class="hero flex items-center justify-center text-center text-white">
  <div class="max-w-4xl px-6">
    <h1 class="text-6xl md:text-8xl font-serif italic tracking-wider mb-6">Keely & Brian's<br>Family Recipes</h1>
    <p class="text-3xl mb-12">Love. Tradition. Flavor.</p>
    <button onclick="showAllRecipes()" class="bg-amber-700 hover:bg-amber-600 text-xl px-12 py-5 rounded-full">Browse Recipes →</button>
  </div>
</div>

<!-- Categories (25% smaller) -->
<div class="max-w-6xl mx-auto px-6 py-8">
  <h2 class="text-4xl font-serif mb-6">Categories</h2>
  <div id="categories" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
</div>

<!-- All Recipes -->
<div id="allRecipes" class="max-w-6xl mx-auto px-6 py-8 hidden">
  <h2 class="text-4xl font-serif mb-8">Our Family Favorites</h2>
  <div id="recipeGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
</div>

<!-- Add Recipe Form -->
<div id="addForm" class="max-w-2xl mx-auto px-6 py-8 hidden">
  <h2 class="text-4xl font-serif mb-8">Add a New Family Recipe</h2>
  <div class="bg-white p-8 rounded-3xl shadow">
    <input id="newTitle" placeholder="Recipe Title *" class="w-full mb-4 p-4 border rounded-2xl text-xl">
    <input id="newCategory" placeholder="Category" class="w-full mb-4 p-4 border rounded-2xl">
    <textarea id="newIngredients" placeholder="Ingredients (one per line)" class="w-full h-32 p-4 border rounded-2xl mb-4"></textarea>
    <textarea id="newInstructions" placeholder="Instructions (one step per line)" class="w-full h-32 p-4 border rounded-2xl mb-4"></textarea>
    
    <button onclick="addNewRecipe()" class="w-full bg-amber-900 hover:bg-amber-800 text-white py-6 text-xl rounded-3xl font-bold">
      ADD RECIPE TO COOKBOOK
    </button>
  </div>
</div>

<script>
// Data
let recipes = JSON.parse(localStorage.getItem('keelyBrianRecipes')) || [];

// Navigation
function showHome() {
  hideAll();
  document.getElementById('home').style.display = 'flex';
}

function showAllRecipes() {
  hideAll();
  document.getElementById('allRecipes').classList.remove('hidden');
  renderRecipeGrid(recipes);
}

function showAddForm() {
  hideAll();
  document.getElementById('addForm').classList.remove('hidden');
}

function hideAll() {
  document.getElementById('home').style.display = 'none';
  document.getElementById('allRecipes').classList.add('hidden');
  document.getElementById('addForm').classList.add('hidden');
}

// Add Recipe - Fixed
function addNewRecipe() {
  const title = document.getElementById('newTitle').value.trim();
  if (!title) {
    alert("❌ Please enter a recipe title!");
    return;
  }

  const newRecipe = {
    id: Date.now(),
    title: title,
    category: document.getElementById('newCategory').value.trim() || "Uncategorized",
    ingredients: document.getElementById('newIngredients').value.split('\n').map(i => i.trim()).filter(i => i),
    instructions: document.getElementById('newInstructions').value.split('\n').map(i => i.trim()).filter(i => i),
    images: ["https://picsum.photos/id/201/800/600"]
  };

  recipes.unshift(newRecipe);
  localStorage.setItem('keelyBrianRecipes', JSON.stringify(recipes));

  alert(`✅ "${title}" has been added successfully!`);

  // Clear form
  document.getElementById('newTitle').value = '';
  document.getElementById('newCategory').value = '';
  document.getElementById('newIngredients').value = '';
  document.getElementById('newInstructions').value = '';

  showAllRecipes();
}

// Render
function renderCategories() {
  const cats = ["Breakfast", "Appetizers", "Salads", "Soups", "Pasta", "Side Dishes", "Bread", 
                "Main Dishes", "Desserts", "Beverages", "Condiments", "Seasonings", "Sauces", "Specialty Items"];
  
  document.getElementById('categories').innerHTML = cats.map(cat => `
    <div onclick="filterByCategory('${cat}')" class="category-card bg-white p-4 rounded-3xl text-center cursor-pointer hover:bg-amber-50 border border-amber-900">
      <h3 class="text-xl font-serif">${cat}</h3>
    </div>
  `).join('');
}

function renderRecipeGrid(list) {
  document.getElementById('recipeGrid').innerHTML = list.map(r => `
    <div class="recipe-card bg-white p-6 rounded-3xl shadow cursor-pointer" onclick="alert('Recipe: ${r.title}\\nCategory: ${r.category}')">
      <h3 class="text-2xl font-serif">${r.title}</h3>
      <p class="text-amber-800 mt-2">${r.category}</p>
    </div>
  `).join('');
}

function filterByCategory(cat) {
  const filtered = recipes.filter(r => r.category === cat);
  showAllRecipes();
  renderRecipeGrid(filtered);
}

// Start the app
renderCategories();
renderRecipeGrid(recipes);
showHome();
</script>
</body>
</html>
