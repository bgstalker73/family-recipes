<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keely & Brian's Family Recipes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@400;500;600&display=swap');
    
    body { font-family: 'Poppins', sans-serif; background: #fffaf0; }
    .serif { font-family: 'Playfair Display', serif; }

    .hero { 
      background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), 
                  url('IMG_9206.JPEG') center/cover no-repeat fixed;
      min-height: 100vh;
    }

    .recipe-card { 
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
    }
    .recipe-card:hover { 
      transform: translateY(-12px) scale(1.04); 
      box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25); 
    }

    .heart { cursor: pointer; font-size: 2.4rem; transition: all 0.3s; }
    .heart:hover { transform: scale(1.4) rotate(12deg); }

    .nav-button {
      font-size: 1.35rem;
      font-weight: 700;
      padding: 6px 12px;
      transition: all 0.2s;
    }
    .nav-button:hover {
      color: #9f1239;
      transform: translateY(-1px);
    }

    .form-input {
      width: 100%;
      padding: 1.25rem;
      border: 2px solid #f9a8d4;
      border-radius: 1.5rem;
      font-size: 1.1rem;
    }

    .category-btn {
      padding: 0.75rem 1rem !important;
      font-size: 0.95rem !important;
      min-height: 60px;
    }

    .recipe-list-item:hover {
      background-color: #fdf4f8;
    }

    @media (max-width: 640px) {
      .nav-button { font-size: 1.05rem !important; padding: 5px 8px !important; }
    }
  </style>
</head>
<body class="min-h-screen pb-20">

<nav class="bg-[#FFF3E0] text-amber-900 py-5 sticky top-0 z-50 shadow-xl">
  <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
    <h1 class="text-3xl font-bold serif">Keely & Brian's</h1>
    <div class="flex flex-wrap gap-4 text-lg font-medium">
      <button onclick="showHome()" class="nav-button hover:text-pink-700">Home</button>
      <button onclick="showRecipesPage()" class="nav-button hover:text-pink-700">Recipes</button>
      <button onclick="showFavoritesPage()" class="nav-button hover:text-pink-700">Favs ❤️</button>
      <button onclick="showAddForm()" class="nav-button hover:text-pink-700 font-semibold">+ Add Recipe</button>
    </div>
  </div>
</nav>

<!-- HOME -->
<div id="home" class="hero flex items-center justify-center text-center text-white">
  <div class="max-w-4xl px-6">
    <h1 class="text-6xl md:text-8xl serif italic tracking-wider mb-6">Keely & Brian's<br>Family Recipes</h1>
    <p class="text-3xl mb-12">Love. Tradition. Flavor.</p>
  </div>
</div>

<!-- FAVORITES -->
<div id="favoritesPage" class="max-w-6xl mx-auto px-6 py-12 hidden">
  <h2 class="text-5xl serif mb-8 flex items-center gap-4">❤️ Most Loved Family Favorites</h2>
  <div id="favoritesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
</div>

<!-- RECIPES -->
<div id="recipesPage" class="max-w-6xl mx-auto px-6 py-12 hidden">
  <input id="searchInput" type="text" placeholder="🔍 Search recipes or tags..." 
         class="w-full text-2xl py-6 px-8 rounded-3xl border-4 border-pink-900 mb-6" onkeyup="filterRecipes()">

  <div class="flex justify-between items-center mb-8">
    <h2 class="text-5xl serif">Our Recipe Collection</h2>
    <div class="flex gap-2 bg-white rounded-3xl p-1 shadow-inner">
      <button onclick="setViewMode('list')" id="btnList" class="px-6 py-2 rounded-3xl font-medium">List</button>
      <button onclick="setViewMode('grid')" id="btnGrid" class="px-6 py-2 rounded-3xl font-medium">Grid</button>
    </div>
  </div>

  <div id="categories" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div>
  
  <div id="recipeListView" class="mt-8"></div>
  <div id="recipeGridView" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mt-8 hidden"></div>
</div>

<!-- ADD RECIPE -->
<div id="addForm" class="max-w-2xl mx-auto px-6 py-12 hidden">
  <h2 class="text-5xl serif mb-10 text-center">Add a New Family Treasure 🍲</h2>
  <div class="bg-white p-10 rounded-3xl shadow-2xl">
    <input id="newTitle" placeholder="Recipe Title *" class="form-input mb-8 text-center">
    <select id="newCategory" class="form-input mb-8">
      <option value="">Select Category</option>
      <option value="Main Dishes">Main Dishes</option>
      <option value="Side Dishes">Side Dishes</option>
      <option value="Appetizers">Appetizers</option>
      <option value="Soups">Soups</option>
      <option value="Bread">Bread</option>
      <option value="Desserts">Desserts</option>
      <option value="Salads">Salads</option>
      <option value="Pasta">Pasta</option>
      <option value="Beverages">Beverages</option>
      <option value="Breakfast">Breakfast</option>
      <option value="Sauces & Spices">Sauces & Spices</option>
      <option value="Specialty Items">Specialty Items</option>
    </select>
    <input id="newTags" placeholder="Tags (comma separated)" class="form-input mb-8">

    <div class="mb-10 p-8 border-2 border-dashed border-pink-700 rounded-3xl bg-pink-50">
      <label class="block text-xl mb-4 font-medium">📸 Scan Recipe Card</label>
      <p class="text-sm text-pink-800 mb-6 text-center">Best for 8x11 or 3x5 cards • Plain background recommended</p>
      <div class="grid grid-cols-2 gap-6">
        <button onclick="openCamera()" class="bg-gradient-to-br from-pink-600 to-rose-600 text-white py-8 rounded-3xl flex flex-col items-center gap-3 hover:brightness-110 transition">
          <i class="fas fa-camera text-4xl"></i>
          <span class="font-semibold">Scan Recipe Card</span>
        </button>
        <div id="dropZone" class="drop-zone p-8 text-center rounded-3xl cursor-pointer flex flex-col justify-center border-2 border-dashed border-pink-700 hover:bg-pink-100 transition">
          <i class="fas fa-cloud-upload-alt text-4xl text-pink-700"></i>
          <span class="mt-3 font-medium">Upload Image</span>
          <input type="file" id="imageUpload" accept="image/*" class="hidden" multiple>
        </div>
      </div>
      <div id="previewImages" class="flex flex-wrap gap-4 mt-8"></div>
    </div>

    <textarea id="newIngredients" placeholder="Ingredients (one per line)" class="form-input h-48 mb-8"></textarea>
    <textarea id="newInstructions" placeholder="Instructions (one step per line)" class="form-input h-48 mb-10"></textarea>

    <div class="flex items-center justify-center gap-4 mb-8">
      <button onclick="toggleFavoriteInAdd()" id="addHeart" class="heart text-red-500 text-5xl">♡</button>
      <span class="text-xl font-medium text-pink-900">Favorite</span>
    </div>

    <button onclick="addNewRecipe()" id="addRecipeBtn"
            class="w-full bg-gradient-to-r from-pink-900 to-rose-900 text-white py-7 text-2xl rounded-3xl font-bold transition-all">
      🍳 ADD TO FAMILY COOKBOOK
    </button>
  </div>
</div>

<!-- SINGLE RECIPE -->
<div id="singleRecipePage" class="max-w-4xl mx-auto px-6 py-12 hidden">
  <button onclick="closeSingleRecipe()" class="mb-8 text-2xl hover:text-pink-700 flex items-center gap-3">← Back to Recipes</button>
  <div class="bg-white rounded-3xl shadow-2xl overflow-hidden">
    <div class="relative">
      <img id="singleRecipeMainImage" class="w-full h-96 object-cover cursor-pointer" onclick="openImageViewer()">
    </div>
    <div id="imageThumbnails" class="flex gap-3 p-6 overflow-x-auto bg-gray-50"></div>

    <div class="p-10">
      <div class="flex items-center gap-4 mb-6">
        <h2 id="singleRecipeTitle" class="text-5xl serif flex-1"></h2>
        <button onclick="toggleFavoriteInSingle()" id="singleHeart" class="heart text-red-500">♡</button>
      </div>
      <div id="singleRecipeTags" class="text-pink-700 mb-8"></div>

      <div class="grid md:grid-cols-2 gap-12">
        <div>
          <h3 class="text-3xl serif mb-4">🥕 Ingredients</h3>
          <textarea id="editIngredients" class="w-full h-64 p-6 border-2 border-pink-200 rounded-3xl text-lg"></textarea>
        </div>
        <div>
          <h3 class="text-3xl serif mb-4">👩‍🍳 Instructions</h3>
          <textarea id="editInstructions" class="w-full h-64 p-6 border-2 border-pink-200 rounded-3xl text-lg"></textarea>
        </div>
      </div>

      <button onclick="saveRecipeEdits()" class="mt-6 bg-green-600 hover:bg-green-700 text-white px-8 py-4 rounded-2xl font-semibold">
        💾 Save Changes
      </button>

      <div class="mt-16">
        <h3 class="text-3xl serif mb-4">Family Notes & Memories</h3>
        <textarea id="singleNotesArea" class="w-full h-40 p-6 border-2 border-pink-200 rounded-3xl"></textarea>
        <button onclick="saveNotes()" class="mt-4 bg-pink-700 text-white px-10 py-4 rounded-2xl">Save Notes</button>
      </div>

      <div class="grid grid-cols-1 gap-4 mt-12">
        <button onclick="printIngredientsAndInstructions()" class="w-full bg-pink-800 hover:bg-pink-700 text-white py-5 rounded-3xl text-xl">🖨️ Print Ingredients & Instructions</button>
        <button onclick="printOriginalRecipe()" class="w-full bg-gradient-to-r from-pink-900 to-rose-900 text-white py-7 rounded-3xl text-2xl font-bold">🖨️ Print Full Recipe with Photo</button>
        <button onclick="deleteCurrentRecipeFromSingle()" class="w-full bg-red-700 hover:bg-red-600 text-white py-5 rounded-3xl text-xl">🗑️ Delete This Recipe</button>
      </div>
    </div>
  </div>
</div>

<!-- Image Viewer -->
<div id="imageViewer" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center z-[100] p-4">
  <div class="relative max-w-5xl w-full">
    <div class="absolute top-4 left-1/2 -translate-x-1/2 flex gap-4 z-20 bg-black/70 backdrop-blur-md px-6 py-3 rounded-3xl">
      <button onclick="printCurrentViewerImage()" class="text-white hover:text-gray-300 transition"><i class="fas fa-print"></i></button>
      <button onclick="deleteCurrentViewerImage()" class="text-white hover:text-gray-300 transition"><i class="fas fa-trash"></i></button>
      <button onclick="cropCurrentImage()" class="text-white hover:text-gray-300 transition"><i class="fas fa-crop"></i></button>
      <button onclick="closeImageViewer()" class="text-white hover:text-gray-300 transition text-2xl">✕</button>
    </div>

    <div class="relative mt-16">
      <img id="viewerImage" src="" alt="Recipe Image" class="max-h-[80vh] w-full object-contain rounded-2xl shadow-2xl">
    </div>

    <div class="absolute bottom-8 left-1/2 -translate-x-1/2 flex gap-12">
      <button onclick="prevImage()" class="bg-black/40 hover:bg-black/60 text-white text-4xl w-11 h-11 flex items-center justify-center rounded-full transition">←</button>
      <button onclick="nextImage()" class="bg-black/40 hover:bg-black/60 text-white text-4xl w-11 h-11 flex items-center justify-center rounded-full transition">→</button>
    </div>

    <div id="imageCounter" class="absolute bottom-6 left-1/2 -translate-x-1/2 bg-black/60 text-white px-5 py-1.5 rounded-full text-sm"></div>
  </div>
</div>

<script>
let recipes = JSON.parse(localStorage.getItem('keelyBrianRecipes')) || [];
let newRecipeImages = [];
let currentRecipe = null;
let currentImageIndex = 0;
let isAdding = false;
let currentViewMode = 'list';

const categoryImages = {
  "Breakfast": "https://picsum.photos/id/1080/800/600",
  "Appetizers": "https://picsum.photos/id/292/800/600",
  "Salads": "https://picsum.photos/id/431/800/600",
  "Soups": "https://picsum.photos/id/669/800/600",
  "Pasta": "https://picsum.photos/id/201/800/600",
  "Side Dishes": "https://picsum.photos/id/312/800/600",
  "Bread": "https://picsum.photos/id/870/800/600",
  "Main Dishes": "https://picsum.photos/id/1060/800/600",
  "Desserts": "https://picsum.photos/id/1083/800/600",
  "Beverages": "https://picsum.photos/id/133/800/600",
  "Sauces & Spices": "https://picsum.photos/id/292/800/600",
  "Specialty Items": "https://picsum.photos/id/292/800/600"
};

function getDefaultImage(cat) {
  return categoryImages[cat] || "https://picsum.photos/id/1080/800/600";
}

function saveRecipes() {
  localStorage.setItem('keelyBrianRecipes', JSON.stringify(recipes));
}

// Navigation
function showHome() { hideAll(); document.getElementById('home').style.display = 'flex'; }
function showRecipesPage() { 
  hideAll(); 
  document.getElementById('recipesPage').classList.remove('hidden'); 
  renderCategories();
  setViewMode('list');
}
function showFavoritesPage() { 
  hideAll(); 
  document.getElementById('favoritesPage').classList.remove('hidden'); 
  renderFavorites(); 
}
function showAddForm() { 
  hideAll(); 
  resetAddForm(); 
  document.getElementById('addForm').classList.remove('hidden'); 
}

function hideAll() {
  document.getElementById('home').style.display = 'none';
  document.getElementById('recipesPage').classList.add('hidden');
  document.getElementById('favoritesPage').classList.add('hidden');
  document.getElementById('addForm').classList.add('hidden');
  document.getElementById('singleRecipePage').classList.add('hidden');
  closeImageViewer();
}

function resetAddForm() {
  newRecipeImages = [];
  document.getElementById('previewImages').innerHTML = '';
  document.getElementById('newTitle').value = '';
  document.getElementById('newCategory').value = '';
  document.getElementById('newTags').value = '';
  document.getElementById('newIngredients').value = '';
  document.getElementById('newInstructions').value = '';
  document.getElementById('addHeart').innerHTML = '♡';
  resetButton();
}

function resetButton() {
  const btn = document.getElementById('addRecipeBtn');
  btn.disabled = false;
  btn.innerHTML = '🍳 ADD TO FAMILY COOKBOOK';
}

// Add Recipe
function addNewRecipe() {
  if (isAdding) return;
  isAdding = true;
  const btn = document.getElementById('addRecipeBtn');
  btn.disabled = true;
  btn.innerHTML = 'Adding... 🍳';

  try {
    const title = document.getElementById('newTitle').value.trim();
    if (!title) {
      alert("Please enter a recipe title!");
      return;
    }

    const category = document.getElementById('newCategory').value || "Uncategorized";

    const newRecipe = {
      id: Date.now(),
      title: title,
      category: category,
      tags: document.getElementById('newTags').value.split(',').map(t => t.trim().toLowerCase()).filter(Boolean),
      ingredients: document.getElementById('newIngredients').value.split('\n').map(i => i.trim()).filter(Boolean),
      instructions: document.getElementById('newInstructions').value.split('\n').map(i => i.trim()).filter(Boolean),
      images: newRecipeImages.length ? [...newRecipeImages] : [getDefaultImage(category)],
      favorite: document.getElementById('addHeart').innerHTML === '❤️'
    };

    recipes.unshift(newRecipe);
    saveRecipes();
    showAddSuccess(title);
    setTimeout(() => openRecipe(newRecipe.id), 700);
  } finally {
    resetButton();
    isAdding = false;
  }
}

function showAddSuccess(title) {
  const bubble = document.createElement('div');
  bubble.style.cssText = `position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);background:white;padding:20px 30px;border-radius:9999px;box-shadow:0 15px 35px rgba(0,0,0,0.3);z-index:10000;display:flex;align-items:center;gap:15px;`;
  bubble.innerHTML = `<span class="text-5xl">👨‍🍳</span><span class="text-xl font-medium">Added "${title}" successfully!</span>`;
  document.body.appendChild(bubble);
  setTimeout(() => bubble.remove(), 2000);
}

// View Mode
function setViewMode(mode) {
  currentViewMode = mode;
  document.getElementById('btnList').classList.toggle('bg-pink-100', mode === 'list');
  document.getElementById('btnGrid').classList.toggle('bg-pink-100', mode === 'grid');
  document.getElementById('recipeListView').classList.toggle('hidden', mode !== 'list');
  document.getElementById('recipeGridView').classList.toggle('hidden', mode !== 'grid');

  if (mode === 'list') renderRecipeList(recipes);
  else renderRecipeGrid(recipes);
}

function renderRecipeList(list) {
  const container = document.getElementById('recipeListView');
  container.innerHTML = list.map(r => `
    <div onclick="openRecipe(${r.id})" class="recipe-list-item bg-white p-6 rounded-3xl shadow cursor-pointer hover:shadow-md flex gap-6 items-center border border-pink-100">
      <img src="${r.images?.[0] || getDefaultImage(r.category)}" class="w-20 h-20 object-cover rounded-2xl">
      <div class="flex-1">
        <h3 class="text-2xl font-serif">${r.title}</h3>
        <p class="text-pink-700">${r.category}</p>
      </div>
    </div>
  `).join('');
}

function renderRecipeGrid(list) {
  const container = document.getElementById('recipeGridView');
  container.innerHTML = list.map(r => {
    const imgSrc = r.images?.[0] || getDefaultImage(r.category);
    return `
      <div onclick="openRecipe(${r.id})" class="recipe-card bg-white rounded-3xl overflow-hidden cursor-pointer border border-pink-200">
        <img src="${imgSrc}" class="w-full h-56 object-cover">
        <div class="p-6">
          <h3 class="text-2xl font-serif">${r.title}</h3>
        </div>
      </div>
    `;
  }).join('');
}

// Single Recipe
function openRecipe(id) {
  currentRecipe = recipes.find(r => r.id === id);
  if (!currentRecipe) return alert("Recipe not found");

  document.getElementById('singleRecipeTitle').textContent = currentRecipe.title;
  document.getElementById('singleRecipeTags').innerHTML = currentRecipe.tags && currentRecipe.tags.length ? 
    `Tags: ${currentRecipe.tags.join(', ')}` : '';

  document.getElementById('singleRecipeMainImage').src = currentRecipe.images?.[0] || getDefaultImage(currentRecipe.category);
  renderThumbnails();

  document.getElementById('editIngredients').value = (currentRecipe.ingredients || []).join('\n');
  document.getElementById('editInstructions').value = (currentRecipe.instructions || []).join('\n');

  hideAll();
  document.getElementById('singleRecipePage').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function saveRecipeEdits() {
  if (!currentRecipe) return;
  currentRecipe.ingredients = document.getElementById('editIngredients').value.split('\n').map(i => i.trim()).filter(Boolean);
  currentRecipe.instructions = document.getElementById('editInstructions').value.split('\n').map(i => i.trim()).filter(Boolean);
  saveRecipes();
  alert("✅ Changes saved successfully!");
}

function renderThumbnails() {
  const container = document.getElementById('imageThumbnails');
  container.innerHTML = (currentRecipe.images || []).map((src, i) => `
    <img src="${src}" onclick="openImageViewer(${i})" class="w-24 h-24 object-cover rounded-xl cursor-pointer border-2 border-transparent hover:border-pink-500 transition">
  `).join('');
}

// Image Viewer
let viewerImages = [];

function openImageViewer(startIndex = 0) {
  if (!currentRecipe?.images?.length) return;
  viewerImages = currentRecipe.images;
  currentImageIndex = startIndex;
  updateViewerImage();
  document.getElementById('imageViewer').style.display = 'flex';
}

function updateViewerImage() {
  document.getElementById('viewerImage').src = viewerImages[currentImageIndex];
  document.getElementById('imageCounter').textContent = `${currentImageIndex + 1} / ${viewerImages.length}`;
}

function prevImage() {
  currentImageIndex = (currentImageIndex - 1 + viewerImages.length) % viewerImages.length;
  updateViewerImage();
}

function nextImage() {
  currentImageIndex = (currentImageIndex + 1) % viewerImages.length;
  updateViewerImage();
}

function deleteCurrentViewerImage() {
  if (!confirm("Delete this photo?")) return;
  viewerImages.splice(currentImageIndex, 1);
  currentRecipe.images = viewerImages;
  saveRecipes();
  if (viewerImages.length === 0) {
    closeImageViewer();
    openRecipe(currentRecipe.id);
    return;
  }
  if (currentImageIndex >= viewerImages.length) currentImageIndex--;
  updateViewerImage();
  renderThumbnails();
}

function cropCurrentImage() { alert("Crop feature coming soon!"); }
function closeImageViewer() { document.getElementById('imageViewer').style.display = 'none'; }

function printCurrentViewerImage() {
  const imgSrc = document.getElementById('viewerImage').src;
  if (!imgSrc) return;
  const win = window.open('');
  win.document.write(`<img src="${imgSrc}" style="max-width:100%; height:auto;">`);
  win.document.close();
  win.print();
}

// Touch swipe
let touchStartX = 0;
document.getElementById('imageViewer').addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
document.getElementById('imageViewer').addEventListener('touchend', e => {
  const touchEndX = e.changedTouches[0].screenX;
  if (touchEndX < touchStartX - 50) nextImage();
  if (touchEndX > touchStartX + 50) prevImage();
});

// Other functions
function toggleFavoriteInSingle() {
  if (!currentRecipe) return;
  currentRecipe.favorite = !currentRecipe.favorite;
  document.getElementById('singleHeart').innerHTML = currentRecipe.favorite ? '❤️' : '♡';
  saveRecipes();
}

function deleteCurrentRecipeFromSingle() {
  if (!currentRecipe) return;
  if (!confirm(`Delete "${currentRecipe.title}" permanently?`)) return;
  recipes = recipes.filter(r => r.id !== currentRecipe.id);
  saveRecipes();
  alert("Recipe deleted.");
  closeSingleRecipe();
}

function toggleFavoriteInAdd() {
  const heart = document.getElementById('addHeart');
  heart.innerHTML = heart.innerHTML === '♡' ? '❤️' : '♡';
}

function openCamera() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment';
  input.onchange = e => handleFiles(e.target.files);
  input.click();
}

function setupImageUpload() {
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('imageUpload');
  if (dropZone && fileInput) {
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => handleFiles(fileInput.files));
  }
}

function handleFiles(files) {
  Array.from(files).forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      newRecipeImages.push(e.target.result);
      renderPreviewImages();
    };
    reader.readAsDataURL(file);
  });
}

function renderPreviewImages() {
  const container = document.getElementById('previewImages');
  container.innerHTML = newRecipeImages.map((src, i) => `
    <div class="relative inline-block">
      <img src="${src}" class="w-28 h-28 object-cover rounded-xl cursor-pointer" onclick="showImageViewerForAdd('${src}')">
      <button onclick="removePreviewImage(${i}); event.stopImmediatePropagation()" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 text-xs">×</button>
    </div>
  `).join('');
}

function removePreviewImage(i) {
  newRecipeImages.splice(i, 1);
  renderPreviewImages();
}

function showImageViewerForAdd(src) {
  alert("Preview image. Full viewer available after saving.");
}

function renderCategories() {
  const cats = ["Main Dishes", "Side Dishes", "Appetizers", "Soups", "Bread", "Desserts", "Salads", "Pasta", "Beverages", "Breakfast", "Sauces & Spices", "Specialty Items"];
  document.getElementById('categories').innerHTML = cats.map(cat => `
    <div onclick="filterByCategory('${cat}')" class="category-btn bg-white p-6 rounded-3xl text-center cursor-pointer hover:bg-pink-50 border border-pink-900">
      <h3 class="text-xl">${cat}</h3>
    </div>
  `).join('');
}

function renderFavorites() {
  const favorites = recipes.filter(r => r.favorite).sort((a,b) => b.id - a.id);
  const container = document.getElementById('favoritesGrid');
  container.innerHTML = favorites.length ? favorites.map(r => {
    const imgSrc = r.images?.[0] || getDefaultImage(r.category);
    return `
      <div onclick="openRecipe(${r.id})" class="bg-white p-6 rounded-3xl shadow cursor-pointer">
        <img src="${imgSrc}" class="w-full h-48 object-cover rounded-2xl mb-4">
        <h3 class="text-2xl">${r.title}</h3>
        <p class="text-pink-800">${r.category}</p>
      </div>
    `;
  }).join('') : '<p class="text-center text-xl py-12 text-gray-500">No favorites yet. ❤️ a recipe when adding it!</p>';
}

function filterByCategory(cat) {
  const filtered = recipes.filter(r => r.category === cat);
  if (currentViewMode === 'list') renderRecipeList(filtered);
  else renderRecipeGrid(filtered);
}

function filterRecipes() {
  const term = document.getElementById('searchInput').value.toLowerCase();
  const filtered = recipes.filter(r => 
    r.title.toLowerCase().includes(term) || 
    (r.tags && r.tags.some(tag => tag.includes(term)))
  );
  if (currentViewMode === 'list') renderRecipeList(filtered);
  else renderRecipeGrid(filtered);
}

function closeSingleRecipe() {
  document.getElementById('singleRecipePage').classList.add('hidden');
  showRecipesPage();
}

function printIngredientsAndInstructions() { alert("Print coming soon!"); }
function printOriginalRecipe() { alert("Full recipe print coming soon!"); }
function saveNotes() { alert("Notes saved!"); }

// Initialize
window.onload = function() {
  setupImageUpload();
  renderCategories();
  showHome();
};
</script>
